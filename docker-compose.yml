services:
  etage0:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data:ro
      - ./profils:/app/profils:ro
      - ./referentiel:/app/referentiel
      - ./.etage0:/app/.etage0            # journal de reprise, persistant
    # Par défaut : segmentation déterministe, aucun appel réseau.
    command: ["segmenter"]
    depends_on:
      ollama:
        condition: service_started
        required: false

  # Itération locale gratuite avant la passe payante.
  # Démarrer avec : docker compose --profile local up -d ollama
  ollama:
    image: ollama/ollama:latest
    profiles: ["local"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  ollama:
