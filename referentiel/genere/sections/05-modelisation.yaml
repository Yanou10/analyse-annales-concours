section:
  id: modelisation
  libelle: Modélisation et spécification d'un problème
  ordre: 5
  perimetre: 'Traduire un énoncé en objet formel : graphe, formule, automate, système d''équations, problème
    de décision.'
notions:
- id: modelisation.choisir_structure_donnees_selon_operations
  slug: choisir_structure_donnees_selon_operations
  libelle: Choisir une structure de données adaptée aux opérations répétées par l'algorithme
  semestre: null
  origine:
    genre: prose
    cellule: prose
    source: 3:196-197
    verdict: admis_reformule
  definition_operatoire: La question fournit un problème ou un algorithme et demande quelle représentation
    des données retenir, ou de justifier ce choix, à partir des opérations effectuées le plus souvent
    et de leur coût. Elle peut aussi demander de comparer deux structures candidates pour un même usage.
  declencheurs:
  - Quelle structure de données choisiriez-vous pour représenter … ? Justifier.
  - Justifier le choix d'une file de priorité plutôt qu'une liste pour cet algorithme.
  - Proposer une structure de données permettant d'effectuer ces opérations efficacement.
  - Comparer les deux représentations proposées au regard des opérations à répéter.
  exclusions:
  - motif: Calculer le coût d'un algorithme dont la structure est déjà fixée
    voir: null
    voir_type: null
  - motif: Traduire un énoncé en objet formel (graphe, formule, automate) plutôt que choisir une implémentation
    voir: null
    voir_type: null
  exemples_positifs:
  - source: 2024_InfoA
    question: Q20
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  - pseudocode
  - indetermine
  statut: actif
- id: modelisation.modeliser_jeu_accessibilite_graphe_biparti
  slug: modeliser_jeu_accessibilite_graphe_biparti
  libelle: Modéliser un jeu à deux joueurs par un graphe d'accessibilité biparti
  semestre: null
  origine:
    genre: table
    cellule: commentaires
    source: 4.6:421-426
    verdict: eclate
  definition_operatoire: La question demande de traduire les règles d'un jeu à deux joueurs en un graphe
    où les états sont répartis entre les deux joueurs, avec états finals gagnants pour l'un, pour l'autre,
    ou nuls.
  declencheurs:
  - Modéliser ce jeu par un graphe à deux joueurs
  - Représenter les états contrôlés par J1 et par J2
  - Indiquer les états finals et leur nature (gain, perte, match nul)
  - Donner le graphe du jeu pour les premières configurations
  exclusions:
  - motif: Calcul effectif des positions gagnantes sur le graphe donné
    voir: graphes_algo.calculer_positions_gagnantes_attracteurs
    voir_type: notion
  - motif: Extraction du coup à jouer depuis chaque position gagnante
    voir: graphes_algo.construire_strategie_gagnante_sans_memoire
    voir_type: notion
  - motif: Graphe d'états d'un problème de recherche à un seul agent
    voir: graphes_algo.rechercher_chemin_a_etoile
    voir_type: notion
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  - pseudocode
  statut: actif
- id: modelisation.modeliser_probleme_par_sat
  slug: modeliser_probleme_par_sat
  libelle: Modéliser un problème par une instance de SAT
  semestre: null
  origine:
    genre: table
    cellule: commentaires
    source: 6.2:542-543
    verdict: eclate
  definition_operatoire: La question demande de traduire un énoncé combinatoire (coloration de graphe,
    placement, planification) en formule propositionnelle, en explicitant les variables et les contraintes,
    éventuellement sous forme n-SAT.
  declencheurs:
  - Proposer un jeu de variables propositionnelles codant ce problème
  - Écrire les contraintes de coloration sous forme de clauses
  - Montrer que ce problème se ramène à une instance de 3-SAT
  - Modéliser cette situation par une formule satisfiable si et seulement si une solution existe
  exclusions:
  - motif: Résolution effective de l'instance obtenue
    voir: logique.resoudre_sat_par_quine
    voir_type: notion
  - motif: Réduction formelle utilisée pour prouver une NP-complétude
    voir: null
    voir_type: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  - pseudocode
  statut: actif
