- id: logique.resoudre_sat_par_quine
  slug: resoudre_sat_par_quine
  libelle: Résoudre SAT par l'algorithme de Quine
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 6.2:542-543
    verdict: eclate
  definition_operatoire: La question demande de dérouler, écrire ou analyser l'algorithme de Quine (affectation
    successive des variables et simplification) pour décider la satisfiabilité d'une formule.
  declencheurs:
  - Dérouler l'algorithme de Quine sur cette formule
  - Écrire une fonction qui décide la satisfiabilité par l'algorithme de Quine
  - Donner la complexité de l'algorithme de Quine dans le pire cas
  - Simplifier la formule après affectation de la variable x
  exclusions:
  - motif: Justification sémantique de satisfiabilité sans procédure algorithmique
    voir: logique.decider_satisfiabilite_tautologie
    voir_type: notion
  - motif: Traduction d'un problème concret en instance de SAT
    voir: modelisation.modeliser_probleme_par_sat
    voir_type: notion
