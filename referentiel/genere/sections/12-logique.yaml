- id: logique.representer_forme_normale_listes
  slug: representer_forme_normale_listes
  libelle: Représenter une forme normale par des listes de listes de littéraux
  semestre: null
  origine:
    genre: table
    cellule: commentaires
    source: 6.2:539-541
    verdict: eclate
  definition_operatoire: La question demande de choisir ou d'exploiter un codage d'une FNC/FND comme liste
    de clauses, chaque clause étant une liste de littéraux, et d'écrire les fonctions qui manipulent ce
    codage.
  declencheurs:
  - Proposer un type pour représenter une formule en FNC
  - Écrire une fonction qui évalue une clause représentée par une liste de littéraux
  - Coder un littéral par un entier signé et justifier ce choix
  - Écrire la fonction qui simplifie une liste de clauses
  exclusions:
