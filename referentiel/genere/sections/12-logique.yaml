    verdict: admis_reformule
  definition_operatoire: La question fournit une table de vérité ou une spécification par cas et demande
    d'en déduire la formule en FND complète (ou réciproquement de retrouver la table depuis la forme normale).
  declencheurs:
  - Déduire de la table de vérité une formule en forme normale disjonctive
  - Donner la FND complète de cette fonction booléenne
  - Écrire une formule dont la table de vérité est la suivante
  - Reconnaître si cette formule est en FNC ou en FND
  exclusions:
  - motif: Transformation d'une formule quelconque en forme normale par réécriture
    voir: logique.transformer_en_forme_normale
    voir_type: notion
  - motif: Simple remplissage d'une table de vérité
    voir: logique.evaluer_formule_sous_valuation
    voir_type: notion
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  statut: actif
- id: logique.transformer_en_forme_normale
  slug: transformer_en_forme_normale
  libelle: Mettre une formule sous forme normale conjonctive ou disjonctive
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 6.2:539-541
    verdict: eclate
  definition_operatoire: La question donne une formule quelconque et demande de la transformer en FNC
    ou FND équivalente, ou de décrire/programmer l'algorithme de mise sous forme normale.
  declencheurs:
  - Mettre la formule sous forme normale conjonctive
  - Donner une FND équivalente à cette formule
  - Écrire une fonction qui met une formule sous forme normale
  - Décrire les étapes de la normalisation
  exclusions:
  - motif: Lecture directe de la FND complète depuis une table de vérité
    voir: logique.construire_forme_normale_depuis_table
    voir_type: notion
  - motif: Réécritures logiques sans cible normale
    voir: logique.etablir_equivalence_par_lois
    voir_type: notion
  - motif: Estimation de la taille de la forme normale obtenue
