- id: logique.deriver_sequent_regles_inference
  slug: deriver_sequent_regles_inference
  libelle: Dériver un séquent à l'aide de règles d'inférence données
  semestre: null
  origine:
    genre: table
    cellule: commentaires
    source: 6.3:553-556
    verdict: eclate
  definition_operatoire: La question fournit un jeu de règles d'inférence et un séquent H1,…,Hn ⊢ C, et
    demande d'établir sa dérivabilité en enchaînant les règles (modus ponens, syllogisme, etc.) ou de
    justifier une dérivation proposée.
  declencheurs:
  - Montrer que le séquent p, p → q ⊢ q est dérivable
  - En utilisant les règles précédentes, dériver p → q, q → r ⊢ p → r
  - Justifier chaque étape de la dérivation suivante
  - Quelles règles d'inférence permettent d'obtenir ce séquent ?
  exclusions:
  - motif: Utilisation spécifique des règles d'introduction/élimination des connecteurs de la déduction
      naturelle
    voir: logique.appliquer_regles_intro_elim_connecteurs
    voir_type: notion
  - motif: Description de l'arbre de preuve comme structure définie inductivement
    voir: logique.definir_inductivement_arbre_preuve
    voir_type: notion
  - motif: Vérifier une tautologie par table de vérité ou valuation
    voir: null
    voir_type: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  statut: actif
- id: logique.definir_inductivement_arbre_preuve
  slug: definir_inductivement_arbre_preuve
  libelle: Définir inductivement un arbre de preuve et en vérifier la bonne formation
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 6.3:553-556
    verdict: eclate
  definition_operatoire: 'La question demande de donner ou d''exploiter la définition inductive d''un
    arbre de preuve (feuilles = axiomes/hypothèses, nœuds = instances de règles) : type inductif, vérification
    qu''un arbre donné est bien formé, ou raisonnement par induction sur sa structure.'
  declencheurs:
  - Donner une définition inductive d'un arbre de preuve
  - Proposer un type représentant un arbre de preuve
  - Cet arbre est-il un arbre de preuve valide ? Justifier
  - Raisonner par induction sur la structure de l'arbre de preuve
  exclusions:
  - motif: Construire effectivement la dérivation d'un séquent donné
    voir: logique.deriver_sequent_regles_inference
    voir_type: notion
  - motif: Prouver que tout séquent dérivable est valide sémantiquement
    voir: logique.prouver_correction_deduction_naturelle
    voir_type: notion
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  - ocaml
  statut: actif
- id: logique.appliquer_regles_intro_elim_connecteurs
  slug: appliquer_regles_intro_elim_connecteurs
  libelle: Construire un arbre de preuve avec les règles d'introduction et d'élimination des connecteurs
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 6.3:557-559
    verdict: admis_reformule
  definition_operatoire: La question demande de prouver en déduction naturelle un séquent portant sur
    ∧, ∨, ¬ ou →, en appliquant les règles d'introduction et d'élimination de ces connecteurs, ou de nommer
    la règle utilisée à chaque nœud d'un arbre fourni.
  declencheurs:
  - Donner un arbre de preuve en déduction naturelle de ⊢ (p → q) → (¬q → ¬p)
  - Prouver ce séquent en précisant les règles utilisées
  - Quelle règle d'élimination appliquer ici ?
  - Compléter l'arbre de preuve suivant
  exclusions:
  - motif: Règles portant sur les quantificateurs ∀ et ∃
    voir: logique.appliquer_regles_quantificateurs
    voir_type: notion
  - motif: Dérivation à partir d'un jeu de règles quelconque fourni par l'énoncé (modus ponens, barbara)
    voir: logique.deriver_sequent_regles_inference
    voir_type: notion
  - motif: Établir la validité sémantique des règles elles-mêmes
    voir: logique.prouver_correction_deduction_naturelle
    voir_type: notion
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  statut: actif
- id: logique.prouver_correction_deduction_naturelle
  slug: prouver_correction_deduction_naturelle
  libelle: Prouver la correction de la déduction naturelle par induction sur l'arbre de preuve
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 6.3:560-561
    verdict: admis_reformule
  definition_operatoire: La question demande d'établir que tout séquent dérivable est sémantiquement valide,
    typiquement par induction sur la structure de l'arbre de preuve en vérifiant chaque règle, ou d'exhiber
    le contre-exemple montrant qu'une règle proposée n'est pas correcte.
  declencheurs:
  - Montrer que si H ⊢ C est dérivable alors H ⊨ C
  - Prouver la correction de la déduction naturelle
  - Vérifier que la règle suivante préserve la validité
  - Cette règle d'inférence est-elle correcte ? Justifier
  exclusions:
  - motif: Construire une preuve d'un séquent particulier
    voir: logique.appliquer_regles_intro_elim_connecteurs
    voir_type: notion
  - motif: Définition inductive de l'arbre de preuve sur laquelle porte l'induction
    voir: logique.definir_inductivement_arbre_preuve
