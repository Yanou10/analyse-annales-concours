section:
  id: logique
  libelle: Logique propositionnelle et déduction
  ordre: 12
  perimetre: Formules, valuations, formes normales, SAT, règles d'inférence, arbres de preuve.
notions:
- id: logique.representer_formule_par_arbre
  slug: representer_formule_par_arbre
  libelle: Représenter une formule propositionnelle par un arbre syntaxique
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 6.1:511-513
    verdict: eclate
  definition_operatoire: La question demande de construire l'arbre syntaxique d'une formule donnée, de
    définir le type de données correspondant, ou de retrouver la formule à partir de son arbre.
  declencheurs:
  - Donner l'arbre syntaxique de la formule suivante
  - Définir un type représentant les formules propositionnelles
  - Écrire la formule correspondant à l'arbre ci-dessous
  - Proposer une structure de données pour manipuler une formule en machine
  exclusions:
  - motif: Écrire une fonction récursive parcourant l'arbre pour produire l'écriture linéaire ou énumérer
      les sous-formules
    voir: logique.parcourir_formule_par_induction_structurelle
    voir_type: notion
  - motif: Calculer la taille ou la hauteur de la formule
    voir: logique.mesurer_taille_hauteur_formule
    voir_type: notion
  - motif: Évaluer la formule sous une valuation (sémantique)
    voir: null
    voir_type: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - ocaml
  - pseudocode
  - theorique
  statut: actif
- id: logique.parcourir_formule_par_induction_structurelle
  slug: parcourir_formule_par_induction_structurelle
  libelle: Traiter une formule par induction sur sa structure syntaxique
  semestre: null
  origine:
    genre: table
    cellule: commentaires
    source: 6.1:511-513
    verdict: eclate
  definition_operatoire: 'La question demande d''écrire une fonction ou un raisonnement suivant la définition
    inductive d''une formule : énumérer ses sous-formules, produire son écriture comme mot (préfixe, infixe,
    postfixe) par un parcours d''arbre, ou traiter récursivement chaque cas de connecteur.'
  declencheurs:
  - Écrire une fonction récursive qui renvoie la liste des sous-formules
  - Donner l'écriture préfixe (resp. infixe) de cette formule et le parcours d'arbre correspondant
  - Écrire une fonction qui affiche une formule
  - Montrer par induction structurelle que toute formule vérifie ...
  exclusions:
  - motif: Seule la construction ou la lecture de l'arbre est demandée, sans traitement récursif
    voir: logique.representer_formule_par_arbre
    voir_type: notion
  - motif: Le parcours sert uniquement à calculer taille ou hauteur
    voir: logique.mesurer_taille_hauteur_formule
    voir_type: notion
  - motif: Le parcours réalise une substitution de variable
    voir: logique.appliquer_substitution_variable
    voir_type: notion
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - ocaml
  - pseudocode
  - theorique
  statut: actif
- id: logique.mesurer_taille_hauteur_formule
  slug: mesurer_taille_hauteur_formule
  libelle: Calculer la taille et la hauteur d'une formule
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 6.1:514-514
    verdict: admis_reformule
  definition_operatoire: La question demande de déterminer, définir inductivement ou programmer la taille
    (nombre de nœuds/symboles) ou la hauteur d'une formule propositionnelle, ou de comparer ces mesures.
  declencheurs:
  - Donner la taille et la hauteur de la formule suivante
  - Définir par induction la hauteur d'une formule
  - Écrire une fonction calculant la taille d'une formule
  - Majorer le nombre de variables d'une formule en fonction de sa taille
  exclusions:
  - motif: Coût d'un algorithme exprimé en fonction de la taille de la formule
    voir: null
    voir_type: null
  - motif: Autre traitement récursif de la structure (sous-formules, écritures)
    voir: logique.parcourir_formule_par_induction_structurelle
    voir_type: notion
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  - ocaml
  - pseudocode
  statut: actif
- id: logique.formaliser_avec_quantificateurs
  slug: formaliser_avec_quantificateurs
  libelle: Formaliser un énoncé à l'aide des quantificateurs universel et existentiel
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 6.1:515-515
    verdict: admis_reformule
  definition_operatoire: La question demande d'écrire une formule quantifiée traduisant un énoncé en français,
    ou de lire/interpréter une formule comportant des quantificateurs.
  declencheurs:
  - Traduire l'énoncé suivant par une formule quantifiée
  - Écrire à l'aide de quantificateurs la propriété ...
  - Exprimer en français la formule suivante
  - Nier la formule quantifiée suivante
  exclusions:
  - motif: Identifier les occurrences libres ou liées et la portée d'un quantificateur
    voir: logique.identifier_variables_libres_liees_portee
    voir_type: notion
  - motif: Remplacer une variable par un terme dans une formule
    voir: logique.appliquer_substitution_variable
    voir_type: notion
  - motif: Modélisation purement propositionnelle d'un problème (contraintes, planification)
    voir: null
    voir_type: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  statut: actif
- id: logique.identifier_variables_libres_liees_portee
  slug: identifier_variables_libres_liees_portee
  libelle: Déterminer les variables libres, liées et la portée des quantificateurs d'une formule
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 6.1:516-516
    verdict: admis_reformule
  definition_operatoire: La question demande, pour une formule donnée, de dire quelles occurrences de
    variables sont libres ou liées, de délimiter la portée d'un quantificateur, ou de renommer une variable
    liée sans changer le sens.
  declencheurs:
  - Donner les variables libres de la formule suivante
  - Indiquer la portée de chaque quantificateur
  - Cette occurrence de x est-elle libre ou liée ?
  - Renommer les variables liées pour éviter la capture
  exclusions:
  - motif: Écrire une formule quantifiée traduisant un énoncé
    voir: logique.formaliser_avec_quantificateurs
    voir_type: notion
  - motif: Effectuer effectivement le remplacement d'une variable
    voir: logique.appliquer_substitution_variable
    voir_type: notion
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  statut: actif
- id: logique.appliquer_substitution_variable
  slug: appliquer_substitution_variable
  libelle: Appliquer la substitution d'une variable dans une formule
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 6.1:517-517
    verdict: admis_reformule
  definition_operatoire: La question demande de calculer le résultat du remplacement d'une variable par
    une formule ou un terme, de définir cette opération par induction, ou de la programmer sur la représentation
    arborescente.
  declencheurs:
  - Calculer F[x := G]
  - Définir par induction la substitution d'une variable propositionnelle par une formule
  - Écrire une fonction qui substitue une variable dans une formule
  - Que devient la formule si l'on remplace p par ...
  exclusions:
  - motif: Déterminer seulement quelles variables sont libres ou liées
    voir: logique.identifier_variables_libres_liees_portee
    voir_type: notion
  - motif: Unification de deux formules (hors programme, non couvert)
    voir: null
    voir_type: null
  - motif: Évaluation sous une valuation plutôt que remplacement syntaxique
    voir: null
    voir_type: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  - ocaml
  - pseudocode
  statut: actif
- id: logique.evaluer_formule_sous_valuation
  slug: evaluer_formule_sous_valuation
  libelle: Évaluer une formule propositionnelle sous une valuation
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 6.2:527-528
    verdict: admis_reformule
  definition_operatoire: La question fournit une formule et une valuation (ou demande d'énumérer toutes
    les valuations dans une table de vérité) et demande la valeur de vérité obtenue.
  declencheurs:
  - Donner la valeur de vérité de la formule pour la valuation v
  - Compléter la table de vérité de la formule suivante
  - Cette valuation est-elle un modèle de la formule ?
  - Calculer récursivement la valeur de vérité de la formule
  exclusions:
  - motif: Décider s'il existe une valuation satisfaisant la formule
    voir: logique.decider_satisfiabilite_tautologie
    voir_type: notion
  - motif: Comparer deux formules pour toute valuation
    voir: logique.etablir_equivalence_par_lois
    voir_type: notion
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  - ocaml
  - pseudocode
  statut: actif
- id: logique.decider_satisfiabilite_tautologie
  slug: decider_satisfiabilite_tautologie
  libelle: Déterminer si une formule est satisfiable, tautologique ou antilogique
  semestre: null
  origine:
    genre: table
    cellule: commentaires
    source: 6.2:529-532
    verdict: admis_reformule
  definition_operatoire: La question donne une formule et demande d'exhiber un modèle, de décrire son
    ensemble de modèles, ou de justifier qu'elle est valide pour toute valuation ou pour aucune.
  declencheurs:
  - Cette formule est-elle satisfiable ? Donner un modèle
  - Montrer que la formule est une tautologie
  - Décrire l'ensemble des modèles de la formule
  - Montrer que cette formule est une antilogie
  exclusions:
  - motif: Simple calcul de la valeur de vérité pour une valuation donnée
    voir: logique.evaluer_formule_sous_valuation
    voir_type: notion
  - motif: Résolution algorithmique de SAT par exploration (Quine)
    voir: logique.resoudre_sat_par_quine
    voir_type: notion
  - motif: Classement du problème SAT dans une classe de complexité
    voir: null
    voir_type: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  statut: actif
- id: logique.etablir_equivalence_par_lois
  slug: etablir_equivalence_par_lois
  libelle: Établir l'équivalence de deux formules et appliquer les lois usuelles
  semestre: null
  origine:
    genre: table
    cellule: commentaires
    source: 6.2:533-534
    verdict: admis_reformule
  definition_operatoire: La question demande de montrer que deux formules ont les mêmes modèles, ou de
    réécrire une formule à l'aide des lois de De Morgan, du tiers exclu ou de la décomposition de l'implication.
  declencheurs:
  - Montrer que ces deux formules sont équivalentes
  - Récrire la formule en éliminant les implications
  - Appliquer les lois de De Morgan pour descendre les négations
  - Justifier que ces deux écritures ont les mêmes modèles
  exclusions:
  - motif: Réécriture visant précisément une FNC ou une FND
    voir: logique.transformer_en_forme_normale
    voir_type: notion
  - motif: Relation de conséquence logique (implication sémantique) et non équivalence
    voir: logique.justifier_consequence_logique
    voir_type: notion
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  statut: actif
- id: logique.justifier_consequence_logique
  slug: justifier_consequence_logique
  libelle: Justifier une conséquence logique entre formules
  semestre: null
  origine:
    genre: table
    cellule: commentaires
    source: 6.2:535-536
    verdict: admis_reformule
  definition_operatoire: La question demande de montrer (ou de réfuter) que toute valuation modèle d'une
    formule ou d'un ensemble Γ est aussi modèle de φ, y compris en exhibant un contre-modèle.
  declencheurs:
  - Montrer que Γ ⊨ φ
  - La formule ψ est-elle conséquence logique de φ ?
  - Donner un contre-modèle réfutant cette conséquence
  - Montrer que φ ⊨ ψ mais que la réciproque est fausse
  exclusions:
  - motif: Double conséquence, c'est-à-dire équivalence
    voir: logique.etablir_equivalence_par_lois
    voir_type: notion
  - motif: Dérivation syntaxique par règles d'inférence plutôt que sémantique
    voir: null
    voir_type: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  statut: actif
- id: logique.construire_forme_normale_depuis_table
  slug: construire_forme_normale_depuis_table
  libelle: Construire la forme normale disjonctive complète depuis une table de vérité
  semestre: null
  origine:
    genre: table
    cellule: commentaires
