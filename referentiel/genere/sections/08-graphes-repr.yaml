section:
  id: graphes_repr
  libelle: 'Graphes : représentation et parcours'
  ordre: 8
  perimetre: Représenter un graphe, le parcourir, exploiter un parcours.
notions:
- id: graphes_repr.parcourir_graphe_largeur
  slug: parcourir_graphe_largeur
  libelle: Parcourir un graphe en largeur
  semestre: S2
  origine:
    genre: table
    cellule: notions
    source: 4.5:377-380
    verdict: eclate
  definition_operatoire: La question demande d'écrire, dérouler ou compléter un parcours en largeur d'un
    graphe, éventuellement pour produire l'ordre de visite ou les niveaux des sommets.
  declencheurs:
  - Écrire une fonction réalisant un parcours en largeur
  - Donner l'ordre de visite des sommets lors d'un parcours en largeur depuis s
  - Calculer les distances en nombre d'arêtes depuis un sommet
  - Justifier la complexité du parcours en largeur selon la représentation
  exclusions:
  - motif: Parcours qui explore en profondeur avec pile ou récursion
    voir: graphes_repr.parcourir_graphe_profondeur
    voir_type: notion
  - motif: Construction et exploitation de l'arbre de parcours (arêtes de liaison, classification)
    voir: graphes_repr.construire_arborescence_parcours
    voir_type: notion
  - motif: Plus courts chemins dans un graphe pondéré
    voir: graphes_algo.calculer_plus_courts_chemins_dijkstra
    voir_type: notion
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - ocaml
  - c
  - theorique
  statut: actif
- id: graphes_repr.parcourir_graphe_profondeur
  slug: parcourir_graphe_profondeur
  libelle: Parcourir un graphe en profondeur
  semestre: S2
  origine:
    genre: table
    cellule: notions
    source: 4.5:377-380
    verdict: eclate
  definition_operatoire: La question demande d'écrire, dérouler ou adapter un parcours en profondeur (récursif
    ou avec pile), avec dates de début/fin ou ordre de visite.
  declencheurs:
  - Écrire une fonction récursive de parcours en profondeur
  - Dérouler un parcours en profondeur à partir du sommet a
  - Donner les dates de début et de fin de traitement des sommets
  - Adapter le parcours en profondeur pour marquer les sommets visités
  exclusions:
  - motif: Parcours niveau par niveau avec file
    voir: graphes_repr.parcourir_graphe_largeur
    voir_type: notion
  - motif: Utilisation du parcours en profondeur pour ordonner les sommets d'un DAG
    voir: graphes_algo.trier_topologiquement_dag
    voir_type: notion
  - motif: Double parcours en profondeur pour les composantes fortement connexes
    voir: graphes_algo.rechercher_composantes_fortement_connexes_kosaraju
    voir_type: notion
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - ocaml
  - c
  - theorique
  statut: actif
- id: graphes_repr.construire_arborescence_parcours
  slug: construire_arborescence_parcours
  libelle: Construire et exploiter l'arborescence d'un parcours
  semestre: S2
  origine:
    genre: table
    cellule: notions
    source: 4.5:377-380
    verdict: eclate
  definition_operatoire: La question demande de construire l'arbre (ou la forêt) engendré par un parcours,
    d'en déduire les pères des sommets ou de reconstituer un chemin à partir des liens de parcours.
  declencheurs:
  - Construire l'arborescence associée au parcours effectué
  - Donner le tableau des pères produit par le parcours
  - Reconstituer un chemin depuis la racine à l'aide du tableau des prédécesseurs
  - Classer les arêtes du graphe par rapport à l'arborescence de parcours
  exclusions:
  - motif: Simple ordre de visite d'un parcours en largeur
    voir: graphes_repr.parcourir_graphe_largeur
    voir_type: notion
  - motif: Arbre couvrant de poids minimum d'un graphe pondéré
    voir: graphes_algo.rechercher_arbre_couvrant_minimum_kruskal
    voir_type: notion
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - ocaml
  - c
  - theorique
  statut: actif
- id: graphes_repr.appliquer_parcours_cycle_bicolorabilite
  slug: appliquer_parcours_cycle_bicolorabilite
  libelle: Détecter un cycle ou tester la bicolorabilité à l'aide d'un parcours
  semestre: S2
  origine:
    genre: table
    cellule: commentaires
    source: 4.5:377-380
    verdict: eclate
  definition_operatoire: La question demande d'adapter un parcours de graphe pour décider l'existence
    d'un cycle, la bipartition/bicolorabilité, ou pour calculer des plus courts chemins à distances unitaires.
  declencheurs:
  - Écrire un algorithme détectant la présence d'un cycle dans un graphe
  - Décider si un graphe est bicolorable (biparti) à l'aide d'un parcours
  - Calculer les plus courts chemins dans un graphe où toutes les arêtes ont poids 1
  - Modifier le parcours pour exhiber un cycle impair
  exclusions:
  - motif: Parcours nu, sans objectif de décision
    voir: graphes_repr.parcourir_graphe_largeur
    voir_type: notion
  - motif: Plus courts chemins avec pondérations quelconques positives
    voir: graphes_algo.calculer_plus_courts_chemins_dijkstra
    voir_type: notion
  - motif: Couplage dans un graphe biparti déjà donné comme biparti
    voir: graphes_algo.rechercher_couplage_maximum_chemins_augmentants
    voir_type: notion
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - ocaml
  - c
  - theorique
  statut: actif
- id: graphes_repr.choisir_representation_graphe_selon_complexite
  slug: choisir_representation_graphe_selon_complexite
  libelle: Choisir une représentation de graphe et évaluer son impact sur la complexité
  semestre: null
  origine:
    genre: mise_en_oeuvre
    cellule: mise_en_oeuvre
    source: 4.5:404-405
    verdict: admis_reformule
  definition_operatoire: La question demande de justifier le choix entre matrice et listes d'adjacence
    (ou autre représentation) pour un problème donné, ou de comparer les coûts en temps et en espace d'un
    algorithme selon la représentation retenue.
  declencheurs:
  - Quelle représentation du graphe choisir pour cet algorithme, et pourquoi ?
  - Donner la complexité de cet algorithme avec une matrice puis avec des listes d'adjacence
  - Comparer le coût mémoire des deux représentations pour un graphe creux
  - Justifier que le choix de représentation change la complexité du parcours
  exclusions:
  - motif: Écriture du parcours lui-même
    voir: graphes_repr.parcourir_graphe_largeur
    voir_type: notion
  - motif: Complexité d'un algorithme sans que la représentation soit en jeu
    voir: null
    voir_type: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  - pseudocode
  - c
  - ocaml
  statut: actif
