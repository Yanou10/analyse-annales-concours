- id: strategies.concevoir_glouton_exact
  slug: concevoir_glouton_exact
  libelle: Concevoir un algorithme glouton fournissant une solution exacte et justifier son optimalité
  semestre: S2
  origine:
    genre: table
    cellule: notions
    source: 4.3:340-342
    verdict: eclate
  definition_operatoire: La question demande de proposer un critère de choix glouton pour un problème
    d'optimisation (sélection d'activités, ordonnancement de tâches unitaires avec pénalités) puis d'établir
    que la solution construite est optimale, typiquement par argument d'échange ou par invariant d'extensibilité.
  declencheurs:
  - Proposer un algorithme glouton résolvant ce problème d'ordonnancement
  - Montrer que le choix glouton conduit à une solution optimale
  - Justifier que l'algorithme précédent fournit une solution exacte
  - Donner un critère de tri des activités et prouver son optimalité
  exclusions:
  - motif: Le glouton ne fournit qu'une garantie approchée sur la valeur de la solution
    voir: strategies.analyser_glouton_approximation
    voir_type: notion
  - motif: Construction d'un code préfixe optimal par fusion des deux plus petits poids
    voir: textes.construire_code_huffman
    voir_type: notion
  - motif: Optimalité obtenue en combinant les solutions de sous-problèmes chevauchants
    voir: strategies.concevoir_algorithme_programmation_dynamique
    voir_type: notion
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  - pseudocode
  - ocaml
  - c
  statut: actif
- id: strategies.analyser_glouton_approximation
  slug: analyser_glouton_approximation
  libelle: Concevoir un algorithme d'approximation glouton et majorer son rapport d'approximation
  semestre: S3-4
  origine:
    genre: table
    cellule: notions
    source: 4.3:343-344
    verdict: admis_reformule
  definition_operatoire: La question demande d'appliquer une heuristique gloutonne à un problème d'optimisation
    difficile (couverture par les sommets, sac à dos avec objets triés) et d'établir une borne sur la
    qualité de la solution renvoyée par rapport à l'optimum, ou d'exhiber une instance où le glouton échoue.
  declencheurs:
  - Montrer que cet algonithme glouton fournit une 2-approximation
  - Majorer le rapport entre la solution gloutonne et la solution optimale
