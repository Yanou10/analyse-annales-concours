    mot (type « sinon pendant »), voire de la désambiguïser.
  declencheurs:
  - Donner l'arbre d'analyse du mot ...
  - Donner la dérivation la plus à gauche de ...
  - Montrer que cette grammaire est ambiguë
  - Proposer une grammaire non ambiguë engendrant le même langage
  exclusions:
