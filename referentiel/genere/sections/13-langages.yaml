section:
  id: langages
  libelle: Langages formels et automates
  ordre: 13
  perimetre: Expressions régulières, automates, grammaires, analyse syntaxique.
notions:
- id: langages.construire_langage_operations_regulieres
  slug: construire_langage_operations_regulieres
  libelle: Construire un langage par union, concaténation et étoile de Kleene
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 8.1:600-604
    verdict: eclate
  definition_operatoire: La question demande de calculer, décrire ou comparer des ensembles de mots obtenus
    en appliquant union, concaténation ou étoile de Kleene à des langages donnés.
  declencheurs:
  - Décrire les mots du langage L1·L2
  - Donner les mots de longueur au plus 3 de L*
  - Montrer que ce langage est l'union de ...
  - Calculer la concaténation des deux langages suivants
  exclusions:
  - motif: Écrire une expression régulière notant un langage donné
    voir: langages.denoter_langage_par_expression_reguliere
    voir_type: notion
  - motif: Justifier qu'un langage appartient à la classe des langages réguliers par la définition inductive
    voir: langages.etablir_regularite_par_definition_inductive
    voir_type: notion
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  statut: actif
- id: langages.etablir_regularite_par_definition_inductive
  slug: etablir_regularite_par_definition_inductive
  libelle: Établir qu'un langage est régulier à partir de la définition inductive
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 8.1:600-604
    verdict: eclate
  definition_operatoire: La question demande de justifier l'appartenance (ou non) d'un langage à la classe
    des langages réguliers en exhibant sa construction à partir des langages de base et des trois opérations
    régulières, ou de raisonner par induction sur cette classe.
  declencheurs:
  - Montrer que ce langage est régulier
  - Justifier par induction sur la structure des langages réguliers que ...
  - Ce langage appartient-il à la classe des langages réguliers ?
  exclusions:
  - motif: Simple calcul du résultat d'une opération régulière sur des langages donnés
    voir: langages.construire_langage_operations_regulieres
    voir_type: notion
  - motif: Passage par un automate reconnaissant le langage
    voir: null
    voir_type: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  statut: actif
- id: langages.denoter_langage_par_expression_reguliere
  slug: denoter_langage_par_expression_reguliere
  libelle: Écrire une expression régulière dénotant un langage donné
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 8.1:605-609
    verdict: admis_reformule
  definition_operatoire: La question demande de construire une expression régulière décrivant un ensemble
    de mots spécifié en français, ou inversement de décrire le langage dénoté par une expression régulière
    donnée.
  declencheurs:
  - Donner une expression régulière dénotant le langage des mots qui ...
  - Quel langage est dénoté par l'expression suivante ?
  - Écrire un motif reconnaissant les chaînes de la forme ...
  - Montrer que ces deux expressions régulières dénotent le même langage
  exclusions:
  - motif: Manipulation d'opérations sur les langages sans passer par la syntaxe des expressions
    voir: langages.construire_langage_operations_regulieres
    voir_type: notion
  - motif: Usage des opérateurs étendus de la norme POSIX
    voir: langages.utiliser_expressions_regulieres_etendues
    voir_type: notion
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  - indetermine
  statut: actif
- id: langages.utiliser_expressions_regulieres_etendues
  slug: utiliser_expressions_regulieres_etendues
  libelle: Utiliser les opérateurs étendus d'une expression régulière pour spécifier un motif
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 8.1:610-612
    verdict: admis_reformule
  definition_operatoire: La question demande d'écrire ou d'interpréter un motif employant des raccourcis
    étendus (classes de caractères, quantificateurs, option) au-delà des trois opérations régulières de
    base.
  declencheurs:
  - Écrire un motif POSIX reconnaissant ...
  - Que reconnaît le motif [a-z]+[0-9]? ?
  - Donner l'expression régulière étendue correspondant à ce format
  exclusions:
  - motif: Motif n'utilisant que union, concaténation et étoile
    voir: langages.denoter_langage_par_expression_reguliere
    voir_type: notion
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - indetermine
  - theorique
  statut: actif
- id: langages.construire_afd_reconnaissant_langage
  slug: construire_afd_reconnaissant_langage
  libelle: Construire un automate fini déterministe reconnaissant un langage décrit
  semestre: null
  origine:
    genre: table
    cellule: commentaires
    source: 8.2:620-621
    verdict: eclate
  definition_operatoire: La question fournit une description d'un ensemble de mots ou d'un système à états
    et demande de donner l'automate fini déterministe (états, transitions, état initial, états finaux)
    qui le modélise ou le reconnaît.
  declencheurs:
  - Construire un automate déterministe reconnaissant les mots qui…
  - Donner un automate fini déterministe modélisant ce système
  - Compléter la table de transitions de l'automate déterministe
  - Modéliser le fonctionnement de ce distributeur par un automate
  exclusions:
  - motif: Déterminer l'ensemble des mots acceptés par un automate déjà donné
    voir: langages.caracteriser_langage_reconnu_par_automate
    voir_type: notion
  - motif: Construire l'automate à partir d'une expression régulière
    voir: langages.construire_automate_glushkov_berry_sethi
    voir_type: notion
  - motif: Rendre déterministe un automate non déterministe donné
    voir: langages.determiniser_automate
    voir_type: notion
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  statut: actif
- id: langages.emonder_automate_accessibilite
  slug: emonder_automate_accessibilite
  libelle: Émonder un automate en calculant ses états accessibles et co-accessibles
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 8.2:620-621
    verdict: eclate
  definition_operatoire: La question demande de déterminer quels états d'un automate donné sont accessibles
    depuis l'état initial et/ou co-accessibles vers un état final, puis de supprimer les autres pour obtenir
    l'automate émondé.
  declencheurs:
  - Déterminer les états accessibles et co-accessibles de cet automate
  - Émonder l'automate suivant
  - Justifier que la suppression de cet état ne change pas le langage reconnu
  - Écrire une fonction qui calcule les états accessibles d'un automate
  exclusions:
  - motif: Construction d'un automate à partir d'une spécification
    voir: langages.construire_afd_reconnaissant_langage
    voir_type: notion
  - motif: Parcours de graphe générique sans automate
    voir: null
    voir_type: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  - pseudocode
  - ocaml
  - c
  statut: actif
- id: langages.caracteriser_langage_reconnu_par_automate
  slug: caracteriser_langage_reconnu_par_automate
  libelle: Déterminer le langage reconnu par un automate donné
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 8.2:622-622
    verdict: admis_reformule
  definition_operatoire: La question fournit un automate et demande soit de dire si un mot est accepté
    en simulant les calculs, soit de décrire par une phrase ou une expression l'ensemble des mots reconnus.
  declencheurs:
  - Quel est le langage reconnu par cet automate ?
  - Le mot abba est-il accepté par cet automate ? Justifier
  - Décrire l'ensemble des mots acceptés
  - Écrire une fonction testant si un mot est reconnu par l'automate
  exclusions:
  - motif: Produire une expression régulière équivalente par élimination des états
    voir: langages.convertir_automate_en_expression_reguliere
    voir_type: notion
  - motif: Construire l'automate à partir de la description du langage
    voir: langages.construire_afd_reconnaissant_langage
    voir_type: notion
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  - pseudocode
  - ocaml
  - c
  statut: actif
- id: langages.eliminer_transitions_spontanees
  slug: eliminer_transitions_spontanees
  libelle: Éliminer les transitions spontanées d'un automate
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 8.2:623-623
    verdict: admis_reformule
  definition_operatoire: La question fournit un automate comportant des ε-transitions et demande de calculer
    les clôtures spontanées des états ou de produire un automate équivalent sans transition spontanée.
  declencheurs:
  - Éliminer les ε-transitions de cet automate
  - Calculer la clôture spontanée de chaque état
  - Donner un automate sans transition spontanée reconnaissant le même langage
  - Justifier le lien entre ε-clôture et accessibilité dans le graphe des transitions
  exclusions:
  - motif: Passage d'un automate non déterministe sans ε à un automate déterministe
    voir: langages.determiniser_automate
    voir_type: notion
  - motif: Assemblage d'automates avec ε-transitions à partir d'une expression régulière (Thompson)
    voir: langages.construire_automate_thompson
    voir_type: notion
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  - pseudocode
  statut: actif
- id: langages.construire_exploiter_automate_non_deterministe
  slug: construire_exploiter_automate_non_deterministe
  libelle: Construire un automate non déterministe et en explorer les calculs
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 8.2:624-624
    verdict: admis_reformule
  definition_operatoire: La question demande de proposer un automate non déterministe reconnaissant un
    langage donné, ou d'énumérer les calculs possibles sur un mot pour décider de son acceptation.
  declencheurs:
  - Donner un automate non déterministe reconnaissant ce langage
  - Cet automate est-il déterministe ? Justifier
  - Énumérer tous les chemins étiquetés par ce mot
  - Montrer qu'il existe un calcul acceptant ce mot
  exclusions:
  - motif: Transformation de cet automate en automate déterministe équivalent
    voir: langages.determiniser_automate
    voir_type: notion
  - motif: Automate déterministe construit directement
    voir: langages.construire_afd_reconnaissant_langage
    voir_type: notion
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  statut: actif
- id: langages.determiniser_automate
  slug: determiniser_automate
  libelle: Déterminiser un automate non déterministe par la construction des sous-ensembles
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 8.2:625-625
    verdict: eclate
  definition_operatoire: La question fournit un automate non déterministe et demande de construire l'automate
    déterministe équivalent en prenant pour états des ensembles d'états, ou de justifier l'équivalence
    des langages reconnus.
  declencheurs:
  - Déterminiser l'automate suivant
  - Construire l'automate des parties accessibles
  - Donner la table de transitions de l'automate déterminisé
  - Justifier que l'automate obtenu reconnaît le même langage
  exclusions:
  - motif: Suppression préalable des ε-transitions
    voir: langages.eliminer_transitions_spontanees
    voir_type: notion
  - motif: Suppression des états inutiles
    voir: langages.emonder_automate_accessibilite
    voir_type: notion
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  - pseudocode
  statut: actif
- id: langages.construire_automate_thompson
  slug: construire_automate_thompson
  libelle: Construire un automate par assemblage à la Thompson à partir d'une expression régulière
  semestre: null
  origine:
    genre: table
    cellule: commentaires
    source: 8.2:625-625
    verdict: eclate
  definition_operatoire: La question demande de bâtir un automate reconnaissant le langage d'une expression
    régulière en composant des automates élémentaires par union, concaténation et étoile, avec transitions
    spontanées.
  declencheurs:
  - Construire par la méthode de Thompson un automate pour cette expression
  - Donner l'automate obtenu en assemblant union, concaténation et étoile
  - Proposer un automate avec ε-transitions reconnaissant ce langage
  - Montrer sur cet exemple comment on combine deux automates pour l'union
  exclusions:
  - motif: Construction sans ε-transition de l'automate des positions
    voir: langages.construire_automate_glushkov_berry_sethi
    voir_type: notion
  - motif: 'Sens inverse : automate vers expression régulière'
    voir: langages.convertir_automate_en_expression_reguliere
    voir_type: notion
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  statut: actif
- id: langages.construire_automate_glushkov_berry_sethi
  slug: construire_automate_glushkov_berry_sethi
  libelle: Construire l'automate de Glushkov d'une expression régulière par l'algorithme de Berry-Sethi
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 8.2:626-626
    verdict: admis
  definition_operatoire: La question fournit une expression régulière et demande de la linéariser, de
    calculer les ensembles de premiers, derniers et facteurs de longueur deux, puis d'en déduire l'automate
    de Glushkov.
  declencheurs:
  - Linéariser cette expression régulière et calculer P, D et F
  - Construire l'automate de Glushkov associé à cette expression
  - Appliquer l'algorithme de Berry-Sethi à l'expression donnée
  - Montrer que le langage linéarisé est local
  exclusions:
  - motif: Construction par assemblage avec ε-transitions
    voir: langages.construire_automate_thompson
    voir_type: notion
  - motif: Passage de l'automate à l'expression régulière
    voir: langages.convertir_automate_en_expression_reguliere
    voir_type: notion
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  - pseudocode
  statut: actif
- id: langages.convertir_automate_en_expression_reguliere
  slug: convertir_automate_en_expression_reguliere
  libelle: Convertir un automate en expression régulière par élimination des états
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 8.2:627-627
    verdict: eclate
  definition_operatoire: La question fournit un automate de petite taille et demande de produire une expression
    régulière dénotant son langage en supprimant successivement les états et en étiquetant les transitions
    par des expressions.
  declencheurs:
  - Donner une expression régulière du langage reconnu par cet automate
  - Éliminer les états intermédiaires de cet automate
  - Appliquer la méthode d'élimination des états à l'automate suivant
  - Quelle expression obtient-on après suppression de l'état q1 ?
  exclusions:
  - motif: Sens direct expression vers automate
    voir: langages.construire_automate_glushkov_berry_sethi
    voir_type: notion
  - motif: Simple description informelle du langage reconnu sans expression construite
    voir: langages.caracteriser_langage_reconnu_par_automate
    voir_type: notion
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  statut: actif
- id: langages.appliquer_theoreme_kleene
  slug: appliquer_theoreme_kleene
  libelle: Invoquer le théorème de Kleene pour établir la reconnaissabilité d'un langage
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 8.2:627-627
    verdict: eclate
  definition_operatoire: La question demande de conclure qu'un langage est reconnaissable parce qu'il
    est décrit par une expression régulière (ou l'inverse), en s'appuyant sur l'équivalence des deux formalismes.
  declencheurs:
  - En déduire que ce langage est reconnaissable
  - Justifier l'équivalence entre expressions régulières et automates finis
  - Montrer que tout langage régulier est reconnu par un automate fini
  - Que peut-on conclure du théorème de Kleene sur ce langage ?
  exclusions:
  - motif: Mise en œuvre effective du procédé de conversion sur un automate donné
    voir: langages.convertir_automate_en_expression_reguliere
    voir_type: notion
  - motif: Preuve qu'un langage n'est PAS reconnaissable
    voir: langages.appliquer_lemme_etoile
    voir_type: notion
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  statut: actif
- id: langages.construire_automate_operations_booleennes
  slug: construire_automate_operations_booleennes
  libelle: Construire un automate pour l'union, l'intersection ou le complémentaire de langages reconnaissables
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 8.2:628-628
    verdict: admis_reformule
  definition_operatoire: La question demande de bâtir un automate reconnaissant la combinaison booléenne
    de langages reconnaissables (produit cartésien d'automates, échange des états finaux d'un AFD complet)
    ou d'en déduire qu'un langage est reconnaissable par clôture.
  declencheurs:
  - Construire un automate reconnaissant l'intersection de ces deux langages
  - Donner un automate pour le complémentaire de ce langage
  - Montrer que la classe des langages reconnaissables est stable par union
  - En déduire que ce langage est reconnaissable
  exclusions:
  - motif: Complétion ou déterminisation préalable de l'automate
    voir: langages.determiniser_automate
    voir_type: notion
  - motif: Conclusion par simple invocation de l'équivalence avec les expressions régulières
    voir: langages.appliquer_theoreme_kleene
    voir_type: notion
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  statut: actif
- id: langages.appliquer_lemme_etoile
  slug: appliquer_lemme_etoile
  libelle: Démontrer la non-reconnaissabilité d'un langage par le lemme de l'étoile
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 8.2:629-629
    verdict: admis_reformule
  definition_operatoire: La question demande de prouver qu'un langage n'est reconnu par aucun automate
    fini, en supposant un automate à n états, en choisissant un mot assez long et en exhibant une contradiction
    sur la décomposition u = xyz.
  declencheurs:
  - Montrer que ce langage n'est pas reconnaissable
  - Démontrer à l'aide du lemme de l'étoile que L n'est pas régulier
  - Quel mot choisir pour aboutir à une contradiction ?
  - Justifier qu'aucun automate fini ne reconnaît ce langage
  exclusions:
  - motif: Établir au contraire qu'un langage est reconnaissable
    voir: langages.appliquer_theoreme_kleene
    voir_type: notion
  - motif: Preuve de non-appartenance par clôture booléenne
    voir: langages.construire_automate_operations_booleennes
    voir_type: notion
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  statut: actif
- id: langages.deriver_mot_grammaire
  slug: deriver_mot_grammaire
  libelle: Dériver un mot et déterminer le langage engendré par une grammaire non contextuelle
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 8.3:637-644
    verdict: eclate
  definition_operatoire: La question fournit une grammaire non contextuelle et demande de produire une
    dérivation d'un mot donné, de décider si un mot est engendré, ou de caractériser l'ensemble des mots
    engendrés.
  declencheurs:
  - Donner une dérivation du mot ... dans la grammaire G
  - Montrer que le mot ... appartient au langage engendré par G
  - Décrire le langage engendré par la grammaire suivante
  - Montrer que L(G) = ...
  exclusions:
  - motif: Construire la grammaire à partir d'une syntaxe décrite en français
    voir: langages.ecrire_grammaire_syntaxe
    voir_type: notion
  - motif: Représenter la dérivation sous forme d'arbre ou discuter l'unicité de cet arbre
    voir: langages.construire_arbre_analyse
    voir_type: notion
  - motif: Reconnaissance d'un mot par un automate ou une expression régulière
    voir: null
    voir_type: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  statut: actif
- id: langages.ecrire_grammaire_syntaxe
  slug: ecrire_grammaire_syntaxe
  libelle: Écrire une grammaire non contextuelle engendrant un langage ou une syntaxe donnée
  semestre: null
  origine:
    genre: table
    cellule: commentaires
    source: 8.3:637-644
    verdict: eclate
  definition_operatoire: La question décrit un ensemble de mots ou une syntaxe (expressions arithmétiques,
    formules propositionnelles, mini-langage de programmation ou de balisage) et demande d'en proposer
    les règles de production.
  declencheurs:
  - Proposer une grammaire non contextuelle engendrant le langage ...
  - Donner les règles de production définissant les expressions arithmétiques
  - Écrire une grammaire décrivant la syntaxe des formules de la logique propositionnelle
  - Modifier la grammaire pour engendrer également ...
  exclusions:
  - motif: Grammaire déjà fournie, on demande une dérivation ou le langage engendré
    voir: langages.deriver_mot_grammaire
    voir_type: notion
  - motif: Transformer une grammaire pour lever une ambiguïté
    voir: langages.construire_arbre_analyse
    voir_type: notion
  - motif: Construire la grammaire équivalente à une grammaire donnée
    voir: langages.etablir_equivalence_faible_grammaires
    voir_type: notion
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  statut: actif
- id: langages.montrer_non_contextualite_langage_regulier
  slug: montrer_non_contextualite_langage_regulier
  libelle: Montrer qu'un langage régulier est non contextuel en construisant une grammaire à partir d'un
    automate
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 8.3:637-644
    verdict: eclate
  definition_operatoire: La question demande d'établir qu'un langage donné par une expression régulière
    ou un automate est engendré par une grammaire non contextuelle, typiquement en traduisant les transitions
    en règles de production.
  declencheurs:
  - Montrer que tout langage régulier est non contextuel
  - Construire une grammaire engendrant le langage reconnu par cet automate
  - Déduire des transitions de A un système de règles de production
  exclusions:
  - motif: Écrire une grammaire pour une syntaxe non issue d'un automate
    voir: langages.ecrire_grammaire_syntaxe
    voir_type: notion
