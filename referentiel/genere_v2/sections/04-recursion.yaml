section:
  id: recursion
  libelle: Récursivité et définitions inductives, mise en œuvre
  ordre: 4
  perimetre: Écrire une fonction récursive, concevoir un type inductif, ou analyser le coût machine de
    la récursion. Les PREUVES par induction vont dans preuve.
notions:
- id: recursion.ecrire_fonction_recursive
  slug: ecrire_fonction_recursive
  libelle: Écrire une fonction récursive, y compris par récursivité croisée
  semestre: S2
  origine:
    genre: table
    cellule: notions
    source: 2:168-179
    verdict: eclate
  definition_operatoire: La question demande de programmer ou compléter une fonction qui s'appelle elle-même
    (ou deux fonctions qui s'appellent mutuellement) pour résoudre un problème donné, en identifiant cas
    de base et appels récursifs.
  declencheurs:
  - Écrire une fonction récursive qui …
  - Donner une définition récursive de …
  - Écrire deux fonctions mutuellement récursives qui …
  - Compléter le cas de base et l'appel récursif
  exclusions:
  - motif: Établir la correction ou la terminaison de la fonction récursive écrite
    voir: preuve.prouver_par_induction_structurelle
  - motif: Évaluer le coût de la fonction récursive via une relation de récurrence
    voir: complexite_algo.resoudre_recurrence_de_cout
  - motif: Analyser l'occupation mémoire de la pile d'exécution des appels
    voir: ressources.analyser_cout_machine_appels_recursifs
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - ocaml
  - c
  - pseudocode
  statut: actif
- id: recursion.dessiner_arbre_des_activations
  slug: dessiner_arbre_des_activations
  libelle: Dérouler les appels d'une fonction récursive sous forme d'arbre d'activations
  semestre: S2
  origine:
    genre: table
    cellule: notions
    source: 2:168-179
    verdict: eclate
  definition_operatoire: La question demande de représenter ou d'exploiter l'organisation des appels multiples
    d'une fonction récursive (arbre des activations, ordre des appels, nombre d'appels effectués).
  declencheurs:
  - Représenter l'arbre des appels pour n = …
  - Combien d'appels récursifs sont effectués ?
  - Dérouler l'exécution de f(…) en indiquant les activations successives
  exclusions:
  - motif: Déduire de l'arbre une expression de complexité par récurrence
    voir: complexite_algo.resoudre_recurrence_de_cout
  - motif: Discuter la taille de la pile d'exécution et la sauvegarde de contexte
    voir: ressources.analyser_cout_machine_appels_recursifs
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - ocaml
  - c
  - theorique
  statut: actif
- id: recursion.definir_ensemble_inductif_et_type
  slug: definir_ensemble_inductif_et_type
  libelle: Définir un ensemble par induction et le coder comme type de données
  semestre: S2
  origine:
    genre: table
    cellule: notions
    source: 2:180-184
    verdict: eclate
  definition_operatoire: La question demande de donner les règles d'inférence engendrant un ensemble (arbres,
    formules, termes) comme plus petit ensemble clos par ces règles, ou de traduire cette définition en
    type inductif manipulé par filtrage par motif.
  declencheurs:
  - Donner une définition inductive de l'ensemble des …
  - Déclarer un type représentant ces arbres / ces formules
  - Écrire une fonction par filtrage sur ce type inductif
  - Quelles règles engendrent cet ensemble ?
  exclusions:
  - motif: Démontrer une propriété sur tous les éléments de l'ensemble ainsi défini
    voir: preuve.prouver_par_induction_structurelle
  - motif: Écrire une fonction récursive sur des entiers sans type inductif
    voir: recursion.ecrire_fonction_recursive
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - ocaml
  - theorique
  statut: actif
- id: recursion.definir_types_mutuellement_recursifs
  slug: definir_types_mutuellement_recursifs
  libelle: Définir des types mutuellement récursifs pour modéliser des structures imbriquées
  semestre: null
  origine:
    genre: annexe
    cellule: annexe
    source: traits-divers:829-829
    verdict: admis_reformule
  definition_operatoire: La question demande d'écrire (ou de compléter) deux déclarations de types se
    référençant l'une l'autre, ou d'écrire les fonctions mutuellement récursives qui les parcourent.
  declencheurs:
  - Définir deux types mutuellement récursifs représentant …
  - Compléter la déclaration type … and …
  - Écrire les fonctions mutuellement récursives parcourant ces types
  - Proposer une représentation par types croisés pour cet arbre et ses forêts
  exclusions:
  - motif: Type inductif simple non croisé
    voir: null
  - motif: Preuve par induction structurelle sur ces types
    voir: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - ocaml
  statut: actif
- id: recursion.definir_type_somme_recursif_ocaml
  slug: definir_type_somme_recursif_ocaml
  libelle: Définir un type somme, éventuellement récursif, pour représenter des données
  semestre: null
  origine:
    genre: annexe
    cellule: annexe
    source: types-structurés:800-800
    verdict: admis_reformule
  definition_operatoire: La question demande d'écrire une déclaration de type énuméré ou somme, éventuellement
    récursif (arbre, expression, liste maison), avec des constructeurs portant ou non des arguments, pour
    modéliser les données décrites par l'énoncé.
  declencheurs:
  - Proposer un type OCaml pour représenter un arbre binaire étiqueté
  - Définir un type représentant les formules de la logique propositionnelle
  - Déclarer un type énuméré pour les quatre couleurs
  - Compléter cette définition de type inductif
  exclusions:
  - motif: Écriture des cas de filtrage exploitant les constructeurs
    voir: idiomes.filtrer_par_motif_ocaml
  - motif: Simple synonyme ou abréviation de type sans constructeurs
    voir: idiomes.declarer_type_polymorphe_ocaml
  - motif: Type composite à champs nommés en C
    voir: idiomes.definir_utiliser_struct_c
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - ocaml
  statut: actif
