section:
  id: graphes_repr
  libelle: 'Graphes : représentation et parcours'
  ordre: 8
  perimetre: Représenter un graphe, le parcourir, exploiter un parcours.
notions:
- id: graphes_repr.representer_graphe_matrice_ou_listes
  slug: representer_graphe_matrice_ou_listes
  libelle: Représenter un graphe par matrice ou listes d'adjacence
  semestre: null
  origine:
    genre: table
    cellule: commentaires
    source: 3.4:286-289
    verdict: eclate
  definition_operatoire: La question demande de construire, lire ou convertir la matrice d'adjacence ou
    les listes d'adjacence d'un graphe donné, ou de justifier le choix d'une représentation selon le coût
    en mémoire et le coût des opérations élémentaires (test d'arc, énumération des voisins).
  declencheurs:
  - Donner la matrice d'adjacence de ce graphe
  - Écrire la fonction qui construit les listes d'adjacence à partir de la liste des arcs
  - Comparer les deux représentations en mémoire et en temps pour tester l'existence d'un arc
  - Convertir une matrice d'adjacence en listes d'adjacence
  exclusions:
  - motif: Choix des structures de tableaux et sentinelles propres à C ou OCaml
    voir: graphes_repr.coder_graphe_en_c_et_ocaml
  - motif: Parcourir le graphe une fois représenté
    voir: null
  - motif: Traduire un énoncé applicatif en graphe
    voir: modelisation.modeliser_situation_par_graphe
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - c
  - ocaml
  - theorique
  statut: actif
- id: graphes_repr.calculer_degres_et_chemins
  slug: calculer_degres_et_chemins
  libelle: Calculer degrés, chemins et cycles dans un graphe
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 3.4:286-289
    verdict: eclate
  definition_operatoire: La question demande de dénombrer ou d'établir une relation portant sur les degrés
    entrants et sortants, le nombre d'arcs, l'existence ou la longueur d'un chemin ou d'un cycle dans
    un graphe donné, éventuellement via sa représentation matricielle.
  declencheurs:
  - Donner les degrés entrant et sortant de chaque sommet
  - Montrer que la somme des degrés vaut deux fois le nombre d'arêtes
  - Exhiber un chemin de s à t et un cycle dans ce graphe
  - Que compte le coefficient (i,j) de la puissance k-ième de la matrice d'adjacence ?
  exclusions:
  - motif: Recherche algorithmique d'un plus court chemin pondéré
    voir: null
  - motif: Construction de la représentation elle-même
    voir: graphes_repr.representer_graphe_matrice_ou_listes
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  - pseudocode
  statut: actif
- id: graphes_repr.caracteriser_connexite_et_acyclicite
  slug: caracteriser_connexite_et_acyclicite
  libelle: Caractériser la connexité et l'acyclicité d'un graphe
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 3.4:290-292
    verdict: admis_reformule
  definition_operatoire: La question demande de décider ou de démontrer qu'un graphe donné est connexe,
    fortement connexe, acyclique, un arbre ou une forêt, d'en déterminer les composantes, ou d'exploiter
    les relations entre nombre de sommets, d'arêtes et acyclicité.
  declencheurs:
  - Ce graphe est-il fortement connexe ? Justifier
  - Montrer qu'un graphe connexe acyclique à n sommets possède n−1 arêtes
  - Déterminer les composantes connexes de ce graphe
  - Montrer que ce graphe orienté est acyclique
  exclusions:
  - motif: Algorithme de calcul des composantes fortement connexes ou tri topologique
    voir: null
  - motif: Arbre vu comme structure de données hiérarchique enracinée
    voir: null
  - motif: Simple comptage de degrés ou exhibition d'un chemin
    voir: graphes_repr.calculer_degres_et_chemins
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  statut: actif
- id: graphes_repr.reconnaitre_graphe_biparti
  slug: reconnaitre_graphe_biparti
  libelle: Reconnaître et exploiter la biparticité d'un graphe
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 3.4:293-293
    verdict: admis_reformule
  definition_operatoire: La question demande de décider si un graphe est biparti, d'exhiber la bipartition
    des sommets, ou d'utiliser cette structure (2-coloration, absence de cycle de longueur impaire) dans
    un raisonnement ou une modélisation.
  declencheurs:
  - Ce graphe est-il biparti ? Donner la bipartition
  - Montrer qu'un graphe est biparti si et seulement s'il n'a pas de cycle de longueur impaire
  - Modéliser cette affectation par un graphe biparti
  - Décrire un algorithme testant la biparticité
  exclusions:
  - motif: Recherche d'un couplage maximum dans un graphe biparti
    voir: null
  - motif: Propriétés générales de connexité ou d'acyclicité
    voir: graphes_repr.caracteriser_connexite_et_acyclicite
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  - pseudocode
  statut: actif
- id: graphes_repr.ponderer_et_etiqueter_un_graphe
  slug: ponderer_et_etiqueter_un_graphe
  libelle: Pondérer ou étiqueter les arcs d'un graphe
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 3.4:294-296
    verdict: admis_reformule
  definition_operatoire: La question demande d'ajouter une information numérique ou symbolique aux arcs
    ou arêtes (distance, coût, lettre, valeur booléenne), de choisir la structure qui la stocke, ou d'interpréter
    un objet étiqueté (graphe de distances, automate, diagramme de décision) comme un graphe pondéré.
  declencheurs:
  - Proposer une structure représentant ce graphe pondéré
  - Donner la matrice des poids de ce graphe
  - Comment stocker les étiquettes des arcs dans les listes d'adjacence ?
  - Interpréter cet automate comme un graphe étiqueté
  exclusions:
  - motif: Algorithmes de plus court chemin ou d'arbre couvrant minimal utilisant les poids
    voir: null
  - motif: Représentation d'un graphe non pondéré
    voir: graphes_repr.representer_graphe_matrice_ou_listes
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  - pseudocode
  - c
  - ocaml
  statut: actif
- id: graphes_repr.coder_graphe_en_c_et_ocaml
  slug: coder_graphe_en_c_et_ocaml
  libelle: Coder un graphe et ses manipulations en C ou en OCaml
  semestre: null
  origine:
    genre: mise_en_oeuvre
    cellule: mise_en_oeuvre
    source: 3.4:300-301
    verdict: admis_reformule
  definition_operatoire: 'La question demande d''écrire ou de compléter du code manipulant un graphe dans
    un langage donné : tableaux statiques bidimensionnels en C avec sentinelle ou indicateur de taille
    en tête de ligne, tableaux de listes en OCaml, et opérations usuelles (ajout d''arc, parcours des
    voisins).'
  declencheurs:
  - Écrire en C la structure représentant les listes d'adjacence à l'aide d'un tableau à deux dimensions
  - Écrire en OCaml la fonction qui renvoie les voisins d'un sommet
  - Compléter la fonction d'ajout d'un arc dans cette représentation
  - Quel rôle joue la sentinelle en premier indice de chaque ligne ?
  exclusions:
  - motif: Comparaison abstraite entre matrice et listes d'adjacence sans écriture de code
    voir: graphes_repr.representer_graphe_matrice_ou_listes
  - motif: Technique générale de linéarisation de tableaux hors contexte des graphes
    voir: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - c
  - ocaml
  - mixte
  statut: actif
- id: graphes_repr.parcourir_graphe_largeur
  slug: parcourir_graphe_largeur
  libelle: Parcourir un graphe en largeur
  semestre: S2
  origine:
    genre: table
    cellule: notions
    source: 4.5:377-380
    verdict: eclate
  definition_operatoire: La question demande d'écrire, dérouler ou compléter un parcours en largeur d'un
    graphe, éventuellement pour produire l'ordre de visite ou les niveaux des sommets.
  declencheurs:
  - Écrire une fonction réalisant un parcours en largeur
  - Donner l'ordre de visite des sommets lors d'un parcours en largeur depuis s
  - Calculer les distances en nombre d'arêtes depuis un sommet
  - Justifier la complexité du parcours en largeur selon la représentation
  exclusions:
  - motif: Parcours qui explore en profondeur avec pile ou récursion
    voir: graphes_repr.parcourir_graphe_profondeur
  - motif: Construction et exploitation de l'arbre de parcours (arêtes de liaison, classification)
    voir: graphes_repr.construire_arborescence_parcours
  - motif: Plus courts chemins dans un graphe pondéré
    voir: graphes_algo.calculer_plus_courts_chemins_dijkstra
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - ocaml
  - c
  - theorique
  statut: actif
- id: graphes_repr.parcourir_graphe_profondeur
  slug: parcourir_graphe_profondeur
  libelle: Parcourir un graphe en profondeur
  semestre: S2
  origine:
    genre: table
    cellule: notions
    source: 4.5:377-380
    verdict: eclate
  definition_operatoire: La question demande d'écrire, dérouler ou adapter un parcours en profondeur (récursif
    ou avec pile), avec dates de début/fin ou ordre de visite.
  declencheurs:
  - Écrire une fonction récursive de parcours en profondeur
  - Dérouler un parcours en profondeur à partir du sommet a
  - Donner les dates de début et de fin de traitement des sommets
  - Adapter le parcours en profondeur pour marquer les sommets visités
  exclusions:
  - motif: Parcours niveau par niveau avec file
    voir: graphes_repr.parcourir_graphe_largeur
  - motif: Utilisation du parcours en profondeur pour ordonner les sommets d'un DAG
    voir: graphes_algo.trier_topologiquement_dag
  - motif: Double parcours en profondeur pour les composantes fortement connexes
    voir: graphes_algo.rechercher_composantes_fortement_connexes_kosaraju
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - ocaml
  - c
  - theorique
  statut: actif
- id: graphes_repr.construire_arborescence_parcours
  slug: construire_arborescence_parcours
  libelle: Construire et exploiter l'arborescence d'un parcours
  semestre: S2
  origine:
    genre: table
    cellule: notions
    source: 4.5:377-380
    verdict: eclate
  definition_operatoire: La question demande de construire l'arbre (ou la forêt) engendré par un parcours,
    d'en déduire les pères des sommets ou de reconstituer un chemin à partir des liens de parcours.
  declencheurs:
  - Construire l'arborescence associée au parcours effectué
  - Donner le tableau des pères produit par le parcours
  - Reconstituer un chemin depuis la racine à l'aide du tableau des prédécesseurs
  - Classer les arêtes du graphe par rapport à l'arborescence de parcours
  exclusions:
  - motif: Simple ordre de visite d'un parcours en largeur
    voir: graphes_repr.parcourir_graphe_largeur
  - motif: Arbre couvrant de poids minimum d'un graphe pondéré
    voir: graphes_algo.rechercher_arbre_couvrant_minimum_kruskal
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - ocaml
  - c
  - theorique
  statut: actif
- id: graphes_repr.appliquer_parcours_cycle_bicolorabilite
  slug: appliquer_parcours_cycle_bicolorabilite
  libelle: Détecter un cycle ou tester la bicolorabilité à l'aide d'un parcours
  semestre: S2
  origine:
    genre: table
    cellule: commentaires
    source: 4.5:377-380
    verdict: eclate
  definition_operatoire: La question demande d'adapter un parcours de graphe pour décider l'existence
    d'un cycle, la bipartition/bicolorabilité, ou pour calculer des plus courts chemins à distances unitaires.
  declencheurs:
  - Écrire un algorithme détectant la présence d'un cycle dans un graphe
  - Décider si un graphe est bicolorable (biparti) à l'aide d'un parcours
  - Calculer les plus courts chemins dans un graphe où toutes les arêtes ont poids 1
  - Modifier le parcours pour exhiber un cycle impair
  exclusions:
  - motif: Parcours nu, sans objectif de décision
    voir: graphes_repr.parcourir_graphe_largeur
  - motif: Plus courts chemins avec pondérations quelconques positives
    voir: graphes_algo.calculer_plus_courts_chemins_dijkstra
  - motif: Couplage dans un graphe biparti déjà donné comme biparti
    voir: graphes_algo.rechercher_couplage_maximum_chemins_augmentants
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - ocaml
  - c
  - theorique
  statut: actif
- id: graphes_repr.choisir_representation_graphe_selon_complexite
  slug: choisir_representation_graphe_selon_complexite
  libelle: Choisir une représentation de graphe et évaluer son impact sur la complexité
  semestre: null
  origine:
    genre: mise_en_oeuvre
    cellule: mise_en_oeuvre
    source: 4.5:404-405
    verdict: admis_reformule
  definition_operatoire: La question demande de justifier le choix entre matrice et listes d'adjacence
    (ou autre représentation) pour un problème donné, ou de comparer les coûts en temps et en espace d'un
    algorithme selon la représentation retenue.
  declencheurs:
  - Quelle représentation du graphe choisir pour cet algorithme, et pourquoi ?
  - Donner la complexité de cet algorithme avec une matrice puis avec des listes d'adjacence
  - Comparer le coût mémoire des deux représentations pour un graphe creux
  - Justifier que le choix de représentation change la complexité du parcours
  exclusions:
  - motif: Écriture du parcours lui-même
    voir: graphes_repr.parcourir_graphe_largeur
  - motif: Complexité d'un algorithme sans que la représentation soit en jeu
    voir: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  - pseudocode
  - c
  - ocaml
  statut: actif
