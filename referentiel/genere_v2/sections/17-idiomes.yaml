section:
  id: idiomes
  libelle: Idiomes de programmation
  ordre: 17
  perimetre: Techniques de langage qui se révisent pour elles-mêmes (filtrage par motif, références, linéarisation
    de tableaux, retours multiples par pointeur). Le reste des annexes de langage alimente l'axe langage,
    pas le référentiel.
notions:
- id: idiomes.inferer_type_fragment_code
  slug: inferer_type_fragment_code
  libelle: Inférer le type d'une expression ou d'une fonction à la lecture d'un fragment de code
  semestre: null
  origine:
    genre: table
    cellule: commentaires
    source: 3.1:202-206
    verdict: eclate
  definition_operatoire: La question fournit un fragment de code (typiquement OCaml ou C) et demande de
    donner le type d'une expression, d'une variable ou d'une fonction, ou de repérer une incohérence de
    typage. Toute justification théorique du typage est exclue.
  declencheurs:
  - Donner le type de la fonction f suivante
  - Quel est le type de cette expression ?
  - Indiquer pourquoi ce fragment de code ne compile pas (types)
  - Préciser le type des arguments et du résultat
  exclusions:
  - motif: Écrire une fonction respectant une signature imposée relève de la programmation dans le langage,
      pas de l'inférence de type
    voir: null
  - motif: Concevoir un type inductif pour représenter une structure
    voir: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - ocaml
  - c
  - mixte
  statut: actif
- id: idiomes.lineariser_tableau_multidimensionnel
  slug: lineariser_tableau_multidimensionnel
  libelle: Manipuler des tableaux statiques et paramétrés, y compris leur représentation en mémoire
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 3.1:202-206
    verdict: eclate
  definition_operatoire: La question demande d'accéder, de parcourir ou de représenter des données dans
    un tableau (éventuellement à plusieurs dimensions, ou de type paramétré), en explicitant le calcul
    d'indice ou la structure composée employée.
  declencheurs:
  - Écrire l'accès à l'élément (i,j) d'une matrice stockée dans un tableau unidimensionnel
  - Définir une structure composée contenant un tableau et sa taille
  - Donner le type d'un tableau de tableaux
  exclusions:
  - motif: Inférer le type d'une expression déjà écrite
    voir: idiomes.inferer_type_fragment_code
  - motif: Allouer ce tableau dynamiquement et le libérer
    voir: ressources.gerer_allocation_dynamique_memoire
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - c
  - ocaml
  statut: actif
- id: idiomes.distinguer_structure_mutable_immuable
  slug: distinguer_structure_mutable_immuable
  libelle: Distinguer et programmer des opérations sur structures mutables ou immuables
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 3.1:215-216
    verdict: admis_reformule
  definition_operatoire: La question demande de dire si une structure ou une opération modifie la donnée
    en place ou renvoie une nouvelle valeur, d'écrire les deux variantes d'une même opération, ou d'expliquer
    un effet de partage/aliasing résultant de la mutabilité.
  declencheurs:
  - Cette fonction modifie-t-elle son argument ou renvoie-t-elle une nouvelle structure ?
  - Écrire une version impérative (en place) de cette fonction
  - Expliquer ce que devient l'ancienne valeur après cette opération
  - Quel est l'intérêt d'une structure immuable ici ?
  exclusions:
  - motif: Spécification de l'interface d'une structure abstraite indépendamment de la mutabilité
    voir: sd_sequentielles.specifier_structure_abstraite_par_operations
  - motif: Usage des références et effets de bord comme idiome de langage à part entière
    voir: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - ocaml
  - c
  statut: actif
- id: idiomes.gerer_erreurs_par_exceptions
  slug: gerer_erreurs_par_exceptions
  libelle: Signaler et rattraper un cas d'erreur par une exception
  semestre: null
  origine:
    genre: annexe
    cellule: annexe
    source: divers:814-814
    verdict: admis_reformule
  definition_operatoire: La question demande d'écrire une fonction qui lève une exception dans un cas
    particulier, ou de rattraper cette exception pour poursuivre un traitement (par exemple interrompre
    une recherche ou traiter un cas vide). Elle porte sur le mécanisme de rupture et de reprise du flot
    de contrôle.
  declencheurs:
  - Écrire une fonction qui lève une exception si la liste est vide
  - Modifier la fonction pour qu'elle rattrape l'exception et renvoie une valeur par défaut
  - Utiliser une exception pour interrompre le parcours dès que l'élément est trouvé
  - Que se passe-t-il si failwith est appelé ici ?
  exclusions:
  - motif: Distinguer les cas par filtrage de motif sur un constructeur (option, variant)
    voir: null
  - motif: Vérifier une précondition par assertion en C
    voir: correction.verifier_preconditions_assert
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - ocaml
  statut: actif
- id: idiomes.manipuler_adresse_et_pointeur_c
  slug: manipuler_adresse_et_pointeur_c
  libelle: Prendre l'adresse d'une variable et déclarer un pointeur en C
  semestre: null
  origine:
    genre: annexe
    cellule: annexe
    source: pointeurs-et-gestion-de-la-mémoire:732-732
    verdict: admis_reformule
  definition_operatoire: La question demande d'écrire ou de compléter du code C où l'on déclare un pointeur
    vers un objet existant et où l'on obtient son adresse par &, notamment pour passer une variable modifiable
    à une fonction.
  declencheurs:
  - Écrire une fonction qui modifie la variable passée en argument
  - Déclarer un pointeur vers l'entier v et l'initialiser
  - Compléter la signature de la fonction pour qu'elle renvoie deux valeurs
  - Que vaut l'expression &v ?
  exclusions:
  - motif: Lire ou écrire la valeur pointée par un pointeur déjà obtenu
    voir: idiomes.dereferencer_pointeur_c
  - motif: Obtenir un pointeur par allocation dynamique sur le tas
    voir: ressources.allouer_liberer_memoire_tas_c
  - motif: Arithmétique des pointeurs, explicitement écartée
    voir: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - c
  statut: actif
- id: idiomes.dereferencer_pointeur_c
  slug: dereferencer_pointeur_c
  libelle: Déréférencer un pointeur pour lire ou modifier la valeur pointée
  semestre: null
  origine:
    genre: annexe
    cellule: annexe
    source: pointeurs-et-gestion-de-la-mémoire:733-733
    verdict: admis_reformule
  definition_operatoire: La question demande d'écrire ou d'interpréter du code C utilisant *p (ou ->)
    pour accéder à la valeur désignée par un pointeur valide, en particulier pour écrire un résultat à
    travers un paramètre de sortie.
  declencheurs:
  - Écrire une procédure qui renvoie ses résultats via des pointeurs
  - Que vaut *p après cette instruction ?
  - Compléter le corps de la fonction échange(int *a, int *b)
  - Modifier la valeur de la case pointée
  exclusions:
  - motif: Déclarer le pointeur et récupérer une adresse avec &
    voir: idiomes.manipuler_adresse_et_pointeur_c
  - motif: Tester la nullité d'un pointeur avant d'y accéder dans une structure récursive
    voir: idiomes.chainer_structure_recursive_pointeurs_c
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - c
  statut: actif
- id: idiomes.chainer_structure_recursive_pointeurs_c
  slug: chainer_structure_recursive_pointeurs_c
  libelle: Réaliser une structure récursive chaînée à l'aide de pointeurs et de NULL
  semestre: null
  origine:
    genre: annexe
    cellule: annexe
    source: pointeurs-et-gestion-de-la-mémoire:734-734
    verdict: admis_reformule
  definition_operatoire: La question demande de définir en C un type struct contenant des pointeurs vers
    lui-même (liste, arbre) et d'écrire des fonctions qui la parcourent ou la modifient en testant le
    pointeur NULL comme cas de base ou de fin.
  declencheurs:
  - Définir en C le type des listes chaînées d'entiers
  - Écrire la structure d'un nœud d'arbre binaire en C
  - Écrire une fonction qui insère un élément en tête de la liste chaînée
  - Que représente un pointeur NULL dans cette structure ?
  exclusions:
  - motif: Simple déréférencement d'un pointeur sans structure récursive
    voir: idiomes.dereferencer_pointeur_c
  - motif: Allocation et libération des nœuds sur le tas
    voir: ressources.allouer_liberer_memoire_tas_c
  - motif: Type inductif défini en OCaml plutôt qu'en C par pointeurs
    voir: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - c
  statut: actif
- id: idiomes.transtyper_void_pointeur_c
  slug: transtyper_void_pointeur_c
  libelle: Transtyper un pointeur depuis ou vers void* pour l'usage de malloc
  semestre: null
  origine:
    genre: annexe
    cellule: annexe
    source: pointeurs-et-gestion-de-la-mémoire:736-736
    verdict: admis_reformule
  definition_operatoire: La question demande d'écrire ou de justifier une conversion de type entre void*
    et un type de pointeur précis, typiquement pour exploiter la valeur renvoyée par une fonction d'allocation.
  declencheurs:
  - 'Compléter la ligne : p = (int*) malloc(...)'
  - Pourquoi malloc renvoie-t-il un void* ?
  - Corriger l'erreur de type dans cet appel d'allocation
  exclusions:
  - motif: Calcul de la taille demandée et libération de la mémoire
    voir: ressources.allouer_liberer_memoire_tas_c
  - motif: Arithmétique de pointeurs, hors du champ retenu
    voir: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - c
  statut: actif
- id: idiomes.gerer_tableau_taille_dynamique_c
  slug: gerer_tableau_taille_dynamique_c
  libelle: Gérer un tableau dont la taille n'est pas connue statiquement
  semestre: null
  origine:
    genre: annexe
    cellule: annexe
    source: pointeurs-et-gestion-de-la-mémoire:737-737
    verdict: eclate
  definition_operatoire: 'La question demande d''écrire du code C manipulant un tableau alloué à l''exécution
    : allocation d''après une taille passée en paramètre, transport conjoint du pointeur et de la taille,
    éventuel redimensionnement.'
  declencheurs:
  - Écrire une fonction qui crée un tableau de n éléments, n donné à l'exécution
  - Pourquoi faut-il passer la taille en argument ?
  - Écrire la fonction d'ajout avec doublement de la capacité
  - Compléter la structure représentant un tableau dynamique
  exclusions:
  - motif: Mécanique de l'appel à malloc/sizeof et de free en elle-même
    voir: ressources.allouer_liberer_memoire_tas_c
  - motif: Cas particulier des tableaux à plusieurs dimensions représentés à plat
    voir: idiomes.lineariser_tableau_multidimensionnel_c
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - c
  statut: actif
- id: idiomes.lineariser_tableau_multidimensionnel_c
  slug: lineariser_tableau_multidimensionnel_c
  libelle: Linéariser un tableau multidimensionnel dans un bloc unique
  semestre: null
  origine:
    genre: annexe
    cellule: annexe
    source: pointeurs-et-gestion-de-la-mémoire:737-737
    verdict: eclate
  definition_operatoire: La question demande de représenter une matrice ou un tableau à plusieurs indices
    dans un tableau unidimensionnel et d'écrire la formule d'indice (i*nb_colonnes+j) pour y accéder.
  declencheurs:
  - Écrire l'accès à l'élément (i,j) de la matrice stockée à plat
  - Donner la formule d'indice de la case (i,j)
  - Allouer une matrice n×m dans un seul bloc mémoire
  - Justifier l'intérêt d'un stockage linéarisé
  exclusions:
  - motif: Tableau à une seule dimension de taille dynamique
    voir: idiomes.gerer_tableau_taille_dynamique_c
  - motif: Appel à malloc et libération correspondants
    voir: ressources.allouer_liberer_memoire_tas_c
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - c
  statut: actif
- id: idiomes.utiliser_references_mutables
  slug: utiliser_references_mutables
  libelle: Gérer un état mutable à l'aide de références
  semestre: null
  origine:
    genre: annexe
    cellule: annexe
    source: programmation-impérative:806-806
    verdict: admis_reformule
  definition_operatoire: La question demande d'introduire, de lire ou de mettre à jour une valeur mutable
    dans une fonction (compteur, accumulateur, mémoire d'un parcours) au moyen d'une référence et de ses
    opérateurs de création, de déréférencement et d'affectation.
  declencheurs:
  - Écrire une fonction qui compte le nombre d'appels à l'aide d'une référence
  - Transformer cette fonction récursive en version utilisant un accumulateur mutable
  - Utiliser une référence pour mémoriser le maximum courant
  - Justifier l'emploi d'une référence plutôt que d'un paramètre supplémentaire
  exclusions:
  - motif: Écrire une boucle de répétition contrôlée par une condition ou un compteur
    voir: idiomes.ecrire_boucles_imperatives
  - motif: Modifier une case de tableau ou un champ d'enregistrement mutable sans passer par une référence
    voir: null
  - motif: Retourner plusieurs résultats par pointeur en C
    voir: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - ocaml
  statut: actif
- id: idiomes.ecrire_boucles_imperatives
  slug: ecrire_boucles_imperatives
  libelle: Écrire une itération impérative par boucle conditionnelle ou boucle bornée
  semestre: null
  origine:
    genre: annexe
    cellule: annexe
    source: programmation-impérative:808-808
    verdict: admis_reformule
  definition_operatoire: La question demande de programmer un traitement répétitif en choisissant et en
    écrivant une boucle tant-que ou une boucle pour, avec initialisation et mise à jour correctes des
    variables de contrôle.
  declencheurs:
  - Écrire une version itérative de cette fonction
  - Compléter la boucle qui parcourt le tableau
  - Écrire une boucle qui s'arrête dès que la condition est vérifiée
  - Remplacer cette récursion terminale par une boucle
  exclusions:
  - motif: Prouver l'arrêt de la boucle par un variant ou sa correction par un invariant
    voir: null
  - motif: Créer ou mettre à jour la variable mutable elle-même via une référence
    voir: idiomes.utiliser_references_mutables
  - motif: Écrire une fonction récursive plutôt qu'itérative
    voir: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - ocaml
  - c
  - pseudocode
  statut: actif
- id: idiomes.passer_tableau_en_parametre_c
  slug: passer_tableau_en_parametre_c
  libelle: Passer un tableau en paramètre d'une fonction en C
  semestre: null
  origine:
    genre: annexe
    cellule: annexe
    source: structures-de-contrôle:728-729
    verdict: eclate
  definition_operatoire: La question demande d'écrire ou de corriger une fonction C recevant un tableau,
    en gérant le fait que le paramètre se comporte comme un pointeur et que la taille doit être transmise
    séparément.
  declencheurs:
  - Écrire la fonction C prenant en argument le tableau t et sa taille n
  - Donner le prototype de la fonction qui modifie le tableau passé en argument
  - Expliquer pourquoi les modifications faites dans la fonction sont visibles depuis l'appelant
  - Compléter la signature en C de cette fonction opérant sur un tableau
  exclusions:
  - motif: Renvoyer plusieurs résultats via des paramètres pointeurs
    voir: idiomes.simuler_retours_multiples_par_pointeurs
  - motif: Représenter un tableau à plusieurs dimensions par un tableau linéarisé
    voir: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - c
  statut: actif
- id: idiomes.simuler_retours_multiples_par_pointeurs
  slug: simuler_retours_multiples_par_pointeurs
  libelle: Simuler des valeurs de retour multiples par des paramètres pointeurs
  semestre: null
  origine:
    genre: annexe
    cellule: annexe
    source: structures-de-contrôle:728-729
    verdict: eclate
  definition_operatoire: La question demande d'écrire une fonction C devant fournir plusieurs résultats,
    en passant des pointeurs vers les variables de l'appelant et en les affectant par déréférencement.
  declencheurs:
  - Écrire en C une fonction qui renvoie à la fois le minimum et le maximum
  - Proposer un prototype permettant de retourner deux valeurs
  - Modifier la fonction pour qu'elle renseigne les deux résultats via des pointeurs
  - Expliquer le rôle des arguments de type int* dans cette signature
  exclusions:
  - motif: Transmission d'un tableau à modifier en place
    voir: idiomes.passer_tableau_en_parametre_c
  - motif: Retour d'un n-uplet dans un langage fonctionnel
    voir: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - c
  statut: actif
