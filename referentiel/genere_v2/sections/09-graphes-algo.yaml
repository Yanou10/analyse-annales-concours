section:
  id: graphes_algo
  libelle: 'Graphes : algorithmes pondérés et structurels'
  ordre: 9
  perimetre: Plus courts chemins, arbres couvrants, couplages, composantes, tri topologique.
notions:
- id: graphes_algo.determiner_accessibilite_sommets
  slug: determiner_accessibilite_sommets
  libelle: Déterminer les sommets accessibles depuis un sommet
  semestre: S2
  origine:
    genre: table
    cellule: notions
    source: 4.5:381-385
    verdict: eclate
  definition_operatoire: La question demande de calculer l'ensemble des sommets atteignables depuis un
    ou plusieurs sommets, ou de décider s'il existe un chemin entre deux sommets, éventuellement en reliant
    accessibilité et relation d'ordre dans un graphe orienté acyclique.
  declencheurs:
  - Écrire une fonction qui décide s'il existe un chemin de u à v
  - Calculer l'ensemble des sommets accessibles depuis s
  - Montrer que l'accessibilité dans un graphe orienté acyclique définit un ordre partiel
  - Déterminer la fermeture transitive du graphe
  exclusions:
  - motif: Écriture du parcours lui-même comme objet de la question
    voir: graphes_repr.parcourir_graphe_profondeur
  - motif: Ordonnancement linéaire compatible avec l'accessibilité
    voir: graphes_algo.trier_topologiquement_dag
  - motif: Accessibilité mutuelle regroupée en classes dans un graphe orienté
    voir: graphes_algo.rechercher_composantes_fortement_connexes_kosaraju
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - theorique
  - ocaml
  - c
  statut: actif
- id: graphes_algo.trier_topologiquement_dag
  slug: trier_topologiquement_dag
  libelle: Trier topologiquement un graphe orienté acyclique
  semestre: S2
  origine:
    genre: table
    cellule: notions
    source: 4.5:381-385
    verdict: eclate
  definition_operatoire: La question demande de produire un ordre topologique des sommets d'un graphe
    orienté acyclique, typiquement à partir des dates de fin d'un parcours en profondeur, ou de justifier
    la validité d'un tel ordre.
  declencheurs:
  - Donner un tri topologique du graphe ci-dessus
  - Écrire un algorithme de tri topologique fondé sur un parcours en profondeur
  - Justifier que l'ordre inverse des dates de fin est un ordre topologique
  - Utiliser un tri topologique pour ordonnancer des tâches
  exclusions:
  - motif: Simple calcul des sommets atteignables
    voir: graphes_algo.determiner_accessibilite_sommets
  - motif: Parcours en profondeur demandé pour lui-même
    voir: graphes_repr.parcourir_graphe_profondeur
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - ocaml
  - c
  - theorique
  statut: actif
- id: graphes_algo.rechercher_composantes_connexes
  slug: rechercher_composantes_connexes
  libelle: Rechercher les composantes connexes d'un graphe non orienté
  semestre: S2
  origine:
    genre: table
    cellule: notions
    source: 4.5:381-385
    verdict: eclate
  definition_operatoire: La question demande de calculer les composantes connexes d'un graphe non orienté,
    d'étiqueter chaque sommet par sa composante, ou de compter ces composantes.
  declencheurs:
  - Écrire un algorithme calculant les composantes connexes du graphe
  - Donner le nombre de composantes connexes
  - Étiqueter chaque sommet par le numéro de sa composante
  - Décider si le graphe est connexe
  exclusions:
  - motif: Graphe orienté et accessibilité mutuelle
    voir: graphes_algo.rechercher_composantes_fortement_connexes_kosaraju
  - motif: Parcours en largeur ou profondeur demandé comme tel
    voir: graphes_repr.parcourir_graphe_profondeur
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - ocaml
  - c
  - theorique
  statut: actif
- id: graphes_algo.rechercher_composantes_fortement_connexes_kosaraju
  slug: rechercher_composantes_fortement_connexes_kosaraju
  libelle: Rechercher les composantes fortement connexes par l'algorithme de Kosaraju
  semestre: S3-4
  origine:
    genre: table
    cellule: notions
    source: 4.5:386-388
    verdict: eclate
  definition_operatoire: La question demande de dérouler, écrire ou justifier l'algorithme de Kosaraju
    (parcours en profondeur, graphe transposé, second parcours) pour obtenir les composantes fortement
    connexes d'un graphe orienté, ou son graphe quotient.
  declencheurs:
  - Appliquer l'algorithme de Kosaraju au graphe ci-dessous
  - Écrire une fonction calculant les composantes fortement connexes
  - Justifier la correction du second parcours sur le graphe transposé
  - Donner le graphe des composantes fortement connexes (graphe réduit)
  exclusions:
  - motif: Graphe non orienté et simple connexité
    voir: graphes_algo.rechercher_composantes_connexes
  - motif: Ordonnancement d'un graphe acyclique
    voir: graphes_algo.trier_topologiquement_dag
  - motif: Traduction d'une instance 2-SAT en graphe
    voir: graphes_algo.resoudre_2sat_par_implications
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - ocaml
  - c
  - theorique
  statut: actif
- id: graphes_algo.resoudre_2sat_par_implications
  slug: resoudre_2sat_par_implications
  libelle: Résoudre une instance 2-SAT par le graphe d'implications
  semestre: S3-4
  origine:
    genre: table
    cellule: commentaires
    source: 4.5:386-388
    verdict: eclate
  definition_operatoire: La question demande de traduire une formule 2-SAT en graphe d'implications puis
    de conclure sur sa satisfiabilité à partir des composantes fortement connexes, ou d'en extraire une
    valuation.
  declencheurs:
  - Construire le graphe d'implications associé à cette formule 2-SAT
  - Montrer que la formule est satisfiable si et seulement si aucun littéral n'est dans la même composante
    que sa négation
  - Décider la satisfiabilité de cette instance de 2-SAT
  - Exhiber une valuation à partir des composantes fortement connexes
  exclusions:
  - motif: Calcul des composantes fortement connexes sans lien avec une formule
    voir: graphes_algo.rechercher_composantes_fortement_connexes_kosaraju
  - motif: Satisfiabilité générale d'une formule propositionnelle
    voir: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  - pseudocode
  statut: actif
- id: graphes_algo.calculer_plus_courts_chemins_dijkstra
  slug: calculer_plus_courts_chemins_dijkstra
  libelle: Calculer les plus courts chemins par l'algorithme de Dijkstra
  semestre: S2
  origine:
    genre: table
    cellule: notions
    source: 4.5:389-392
    verdict: eclate
  definition_operatoire: La question demande de dérouler, implémenter ou analyser l'algorithme de Dijkstra
    depuis une source dans un graphe à poids positifs, éventuellement avec file de priorité et listes
    d'adjacence.
  declencheurs:
  - Dérouler l'algorithme de Dijkstra depuis le sommet s
  - Écrire l'algorithme de Dijkstra avec une file de priorité
  - Donner la complexité de Dijkstra selon la structure de file de priorité utilisée
  - Justifier que les poids doivent être positifs
  exclusions:
  - motif: Calcul de toutes les paires de plus courts chemins par récurrence sur les sommets intermédiaires
    voir: graphes_algo.calculer_plus_courts_chemins_floyd_warshall
  - motif: Plus courts chemins à distances unitaires par parcours en largeur
    voir: graphes_repr.appliquer_parcours_cycle_bicolorabilite
  - motif: Structure de file de priorité étudiée pour elle-même
    voir: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - ocaml
  - c
  - theorique
  statut: actif
- id: graphes_algo.calculer_plus_courts_chemins_floyd_warshall
  slug: calculer_plus_courts_chemins_floyd_warshall
  libelle: Calculer les plus courts chemins entre toutes les paires par l'algorithme de Floyd-Warshall
  semestre: S2
  origine:
    genre: table
    cellule: notions
    source: 4.5:389-392
    verdict: eclate
  definition_operatoire: La question demande d'appliquer, écrire ou justifier l'algorithme de Floyd-Warshall
    sur une matrice d'adjacence, d'en donner la récurrence ou la complexité.
  declencheurs:
  - Appliquer l'algorithme de Floyd-Warshall à cette matrice de poids
  - Écrire la relation de récurrence sur les sommets intermédiaires autorisés
  - Donner la complexité en temps et en espace de Floyd-Warshall
  - Adapter Floyd-Warshall pour détecter un cycle de poids négatif
  exclusions:
  - motif: Plus courts chemins depuis une source unique par sélection glouton
    voir: graphes_algo.calculer_plus_courts_chemins_dijkstra
  - motif: Principe général de la programmation dynamique
    voir: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - c
  - ocaml
  - theorique
  statut: actif
- id: graphes_algo.rechercher_arbre_couvrant_minimum_kruskal
  slug: rechercher_arbre_couvrant_minimum_kruskal
  libelle: Rechercher un arbre couvrant de poids minimum par l'algorithme de Kruskal
  semestre: S3-4
  origine:
    genre: table
    cellule: notions
    source: 4.5:393-395
    verdict: admis_reformule
  definition_operatoire: La question demande de dérouler, implémenter ou justifier l'algorithme de Kruskal
    (tri des arêtes, structure unir-trouver) pour construire un arbre couvrant de poids minimum, ou de
    l'adapter à une variante comme le chemin le plus large.
  declencheurs:
  - Appliquer l'algorithme de Kruskal à ce graphe pondéré
  - Écrire l'algorithme de Kruskal en utilisant une structure unir & trouver
  - Justifier la correction du choix glouton d'arête de poids minimal
  - Adapter Kruskal pour trouver le chemin le plus large entre deux sommets
  exclusions:
  - motif: Arbre issu d'un parcours (non pondéré)
    voir: graphes_repr.construire_arborescence_parcours
  - motif: Structure unir & trouver étudiée pour elle-même
    voir: null
  - motif: Plus courts chemins pondérés
    voir: graphes_algo.calculer_plus_courts_chemins_dijkstra
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - ocaml
  - c
  - theorique
  statut: actif
- id: graphes_algo.rechercher_couplage_maximum_chemins_augmentants
  slug: rechercher_couplage_maximum_chemins_augmentants
  libelle: Rechercher un couplage de cardinal maximum dans un graphe biparti par chemins augmentants
  semestre: S3-4
  origine:
    genre: table
    cellule: notions
    source: 4.5:396-400
    verdict: admis_reformule
  definition_operatoire: La question demande d'exhiber ou de calculer un couplage maximum dans un graphe
    biparti en cherchant des chemins augmentants, de justifier la maximalité, ou de modéliser un problème
    d'affectation par un couplage biparti.
  declencheurs:
  - Exhiber un chemin augmentant pour ce couplage et en déduire un couplage plus grand
  - Écrire un algorithme de recherche de couplage maximum dans un graphe biparti
  - Montrer qu'un couplage sans chemin augmentant est de cardinal maximum
  - Modéliser ce problème d'affectation par un couplage dans un graphe biparti
  exclusions:
  - motif: Test de bipartition d'un graphe par parcours
    voir: graphes_repr.appliquer_parcours_cycle_bicolorabilite
  - motif: Algorithme de flot maximal générique
    voir: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - theorique
  - ocaml
  - c
  statut: actif
- id: graphes_algo.calculer_positions_gagnantes_attracteurs
  slug: calculer_positions_gagnantes_attracteurs
  libelle: Déterminer les positions gagnantes par calcul d'attracteurs
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 4.6:421-426
    verdict: eclate
  definition_operatoire: La question demande de calculer itérativement l'attracteur d'un ensemble d'états
    finals dans un jeu à deux joueurs, en distinguant les états du joueur qui contrôle et de l'adversaire,
    et d'en déduire quelles positions sont gagnantes.
  declencheurs:
  - Calculer l'attracteur des états gagnants pour J1
  - Déterminer les positions gagnantes de ce jeu
  - Donner les ensembles successifs A0, A1, ... du calcul d'attracteur
  - Écrire un algorithme calculant les positions gagnantes
  exclusions:
  - motif: Construction du graphe du jeu à partir des règles
    voir: modelisation.modeliser_jeu_accessibilite_graphe_biparti
  - motif: Choix d'un successeur pour jouer effectivement
    voir: graphes_algo.construire_strategie_gagnante_sans_memoire
  - motif: Évaluation approchée par heuristique en profondeur bornée
    voir: strategies.appliquer_minmax_avec_heuristique
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - theorique
  - ocaml
  - c
  statut: actif
- id: graphes_algo.construire_strategie_gagnante_sans_memoire
  slug: construire_strategie_gagnante_sans_memoire
  libelle: Construire une stratégie gagnante sans mémoire
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 4.6:421-426
    verdict: eclate
  definition_operatoire: La question demande d'exhiber, pour chaque position gagnante d'un joueur, le
    coup à jouer sous forme de fonction des états vers les successeurs, et de justifier qu'elle garantit
    le gain.
  declencheurs:
  - Donner une stratégie gagnante pour J1 depuis cette position
  - Construire une stratégie sans mémoire à partir du calcul d'attracteur
  - Justifier que cette stratégie est gagnante
  - Décrire la fonction associant à chaque état le coup à jouer
  exclusions:
  - motif: Calcul des ensembles de positions gagnantes
    voir: graphes_algo.calculer_positions_gagnantes_attracteurs
  - motif: Choix d'un coup par valeur heuristique dans un jeu à somme nulle profond
    voir: strategies.appliquer_minmax_avec_heuristique
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  - pseudocode
  - ocaml
  statut: actif
- id: graphes_algo.rechercher_chemin_a_etoile
  slug: rechercher_chemin_a_etoile
  libelle: Rechercher un chemin dans un graphe d'états par l'algorithme A
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 4.6:430-431
    verdict: eclate
  definition_operatoire: La question demande de dérouler ou d'implémenter une recherche informée guidée
    par f = g + h dans un graphe d'états, en indiquant l'ordre d'exploration, le chemin trouvé ou le coût.
  declencheurs:
  - Dérouler l'algorithme A sur ce graphe d'états avec cette heuristique
  - Donner l'ordre dans lequel les états sont développés
  - Écrire l'algorithme A à l'aide d'une file de priorité
  - Comparer A à un parcours de Dijkstra sur cet exemple
  exclusions:
  - motif: Propriétés de l'heuristique employée (admissibilité, monotonie)
    voir: correction.verifier_admissibilite_monotonie_heuristique
  - motif: Recherche adverse à deux joueurs
    voir: strategies.appliquer_minmax_avec_heuristique
  - motif: Plus courts chemins sans information heuristique
    voir: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - ocaml
  - c
  - theorique
  statut: actif
