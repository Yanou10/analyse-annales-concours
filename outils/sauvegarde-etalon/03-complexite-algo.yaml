section:
  id: complexite_algo
  libelle: "Analyse de complexité d'un algorithme"
  ordre: 3
  perimetre: >
    La question demande d'ÉVALUER OU DE JUSTIFIER le coût d'un algorithme donné ou
    à concevoir — en temps, en espace, dans un régime précisé. Ne pas confondre
    avec la complexité d'un PROBLÈME (classes P, NP, réductions), qui relève de la
    section `complexite_pb`. Le programme insiste lui-même sur cette distinction
    (spe777:688).
  note_origine: >
    §1.1 (spe777:114-117) pour les régimes ; §4.5 Mise en œuvre (spe777:404) pour
    l'impact de la représentation, seule source de cette notion dans tout le
    programme et pourtant question directe dans le corpus.

notions:

  - id: complexite_algo.pire_cas
    libelle: "Établir la complexité en temps dans le pire cas"
    semestre: S1
    origine: {programme: ["spe777:114-117"]}
    definition_operatoire: >
      La question demande une borne sur le nombre d'opérations élémentaires dans
      le cas le plus défavorable, ou de justifier qu'une borne annoncée est
      atteinte. Inclut le comptage direct d'opérations et l'analyse d'un parcours.
    declencheurs:
      - "La complexité doit être en O(…) et on demande de la justifier"
      - "Donner et prouver sa complexité en fonction de …"
      - "en temps O(f(k) × |V(G)|^c)"
    exclusions:
      - {motif: "la borne demandée porte sur la mémoire", voir: complexite_algo.espace}
      - {motif: "il faut résoudre une relation de récurrence pour conclure", voir: complexite_algo.resolution_recurrence}
      - {motif: "il faut montrer qu'AUCUN algorithme ne fait mieux", voir: complexite_algo.borne_inferieure}
      - {motif: "il s'agit de classer un problème dans P ou NP", voir: complexite_pb.classe_p_np}
    exemples_positifs:
      - source: "2024_InfoA#L106"
        extrait: "La complexité doit être en O(log n(t)) et on demande de la justifier."
      - source: "2024_InfoA#L129"
        extrait: "Montrer que la fonction join a une complexité en O(|h(l) − h(r)|)."
      - source: "2024_InfoC#L76"
        extrait: "La complexité de cet algorithme doit être linéaire en le nombre n de sommets de l'arbre. Justifier de la complexité de l'algorithme."
      - source: "2024_InfoC#L213"
        extrait: "Donner la complexité de cet algorithme en fonction de |V(G)|"
    exemples_negatifs:
      - source: "2024_InfoC#L155"
        extrait: "Étant donné un graphe G et un entier k, est-ce que τ(G) ⩽ k ?"
        vers: complexite_pb.probleme_decision
    langages_plausibles: [theorique, mixte, pseudocode]
    statut: actif
    note: >
      Notion la plus chargée du référentiel — 129 occurrences du mot
      « complexité » dans le seul échantillon. Dépassera 4 % sur le corpus
      complet. Axe d'éclatement fixé d'avance : par TECHNIQUE DE JUSTIFICATION
      (résolution de récurrence / comptage d'opérations / amortissement / taille
      de l'arbre d'appels), jamais par objet — un éclatement par objet
      dupliquerait la hiérarchie entière.

  - id: complexite_algo.espace
    libelle: "Établir la complexité en espace mémoire"
    semestre: S1
    origine: {programme: ["spe777:114-117", "spe777:355-357"]}
    definition_operatoire: >
      La question porte sur l'occupation mémoire : taille des structures allouées,
      profondeur de pile, partage de sous-structures. Souvent posée en contraste
      avec le temps, ou pour faire apparaître un partage non évident.
    declencheurs:
      - "Montrer que la complexité en espace de … est en O(…)"
      - "en temps et en espace O(…)"
      - "On souligne les enjeux de complexité en mémoire"
    exclusions:
      - {motif: "seul le nombre d'opérations est en jeu", voir: complexite_algo.pire_cas}
    exemples_positifs:
      - source: "2024_InfoA#L197"
        extrait: "Montrer que la complexité en espace de la construction de a est en O(g(n)) pour une fonction g telle que g(n) = o(f(n)). Expliquer pourquoi il n'y a pas de contradiction."
      - source: "2024_InfoA#L279"
        extrait: "Justifier que l'on peut construire, à partir de la liste des arêtes, le tableau slabs en temps et en espace O(N log N)."
    langages_plausibles: [theorique, mixte]
    statut: actif

  - id: complexite_algo.resolution_recurrence
    libelle: "Résoudre une récurrence de complexité par encadrement élémentaire"
    semestre: S1
    origine: {programme: ["spe777:169-174"]}
    definition_operatoire: >
      Le coût s'exprime par une relation de récurrence — T(n)=T(n−1)+an,
      T(n)=aT(n/2)+b, f(i)=f(i−1)+f(i−3) — et la question demande d'en déduire un
      ordre de grandeur. Le programme proscrit explicitement le théorème maître :
      l'attendu est un encadrement ad hoc.
    declencheurs:
      - "On utilisera le fait que la fonction f(k) définie récursivement … satisfait f(k) ⩽ …"
      - "en déduire la complexité de l'algorithme récursif"
      - "T(n) = aT(n/2) + …"
    exclusions:
      - {motif: "le coût se compte directement, sans récurrence", voir: complexite_algo.pire_cas}
      - {motif: "la récurrence porte sur une propriété, pas sur un coût", voir: preuve.recurrence_numerique}
    exemples_positifs:
      - source: "2024_InfoC#L181"
        extrait: "donner un algorithme récursif (en pseudo-code) qui décide si τ(G) ⩽ k en temps O(1.4656^k × |V(G)|²) … On utilisera le fait que la fonction f(k) définie récursivement comme suit … satisfait f(k) ⩽ 1.4656^k."
      - source: "2024_InfoC#L169"
        extrait: "décide si τ(G) ⩽ k en temps O(2^k × |V(G)|²). Justifier la correction et la complexité de l'algorithme."
    langages_plausibles: [theorique]
    statut: actif

  - id: complexite_algo.borne_inferieure
    libelle: "Établir une borne inférieure ou exhiber un pire cas atteignable"
    semestre: null
    origine: {programme: ["spe777:114-117"], hors_programme_recurrent: true}
    definition_operatoire: >
      La question ne demande pas une majoration mais une MINORATION : montrer
      qu'une quantité peut atteindre un ordre de grandeur, ou qu'aucune approche
      d'une certaine forme ne peut faire mieux. Exige de construire l'instance
      défavorable.
    declencheurs:
      - "Montrer que la quantité … peut être en Θ(…)"
      - "Montrer qu'il existe une instance pour laquelle …"
      - "En déduire que l'algorithme est optimal / que la borne est atteinte"
    exclusions:
      - {motif: "majoration du coût d'un algorithme donné", voir: complexite_algo.pire_cas}
      - {motif: "la minoration porte sur la qualité de la solution, pas sur le coût", voir: strategies.facteur_approximation}
    exemples_positifs:
      - source: "2024_InfoA#L229"
        extrait: "On note Ti le nombre d'arêtes qui traversent la tranche i. … Montrer que la quantité Σ Ti peut être en Θ(N²)."
    langages_plausibles: [theorique]
    statut: actif

  - id: complexite_algo.impact_representation
    libelle: "Choisir une représentation de données et en déduire la complexité"
    semestre: S2
    origine:
      programme: ["spe777:286-293"]
      mise_en_oeuvre: ["spe777:300", "spe777:404"]
    definition_operatoire: >
      La question fait dépendre le coût du CHOIX de représentation — matrice
      d'adjacence contre listes d'adjacence, tableau contre maillons chaînés,
      structure d'ensemble à opérations en O(1) — et demande soit de choisir, soit
      d'exploiter la représentation imposée pour justifier une borne.
    declencheurs:
      - "on fera l'hypothèse que les graphes sont encodés par leur matrice d'adjacence"
      - "on demande d'être précis quant aux structures de données et algorithmes utilisés"
      - "On rappelle qu'avec la représentation en …, il est possible de … en O(…)"
    exclusions:
      - {motif: "implémenter la structure elle-même", voir: sd_sequentielles.implementation_liste}
      - {motif: "aucune alternative de représentation n'est en jeu", voir: complexite_algo.pire_cas}
    exemples_positifs:
      - source: "2024_InfoC#L169"
        extrait: "On rappelle qu'avec la représentation en matrice d'adjacence, il est possible de supprimer l'ensemble des arêtes dont un sommet u est une extrémité en O(|V(G)|)."
      - source: "2024_InfoC#L70"
        extrait: "On supposera que la structure de données utilisée pour représenter l'ensemble T[i] permet en temps O(1) les opérations suivantes"
      - source: "2024_InfoA#L279"
        extrait: "On ne demande pas d'écrire le code, mais on demande d'être précis quant aux structures de données et algorithmes utilisés et on demande d'être convaincant quant à la complexité."
    langages_plausibles: [theorique, pseudocode]
    statut: actif
    note: >
      Notion issue d'un paragraphe « Mise en œuvre » — que le brief initial
      excluait en bloc. C'est un cas où l'exclusion en bloc aurait coûté une
      notion directement posée en question.

  - id: complexite_algo.moyenne
    libelle: "Analyser la complexité en moyenne"
    semestre: S1
    origine: {programme: ["spe777:114-117"]}
    definition_operatoire: >
      La question demande un coût espéré sur une distribution d'entrées ou sur les
      choix aléatoires de l'algorithme, et non une borne sur le pire cas.
    declencheurs:
      - "Quelle est la complexité en moyenne de …"
      - "en espérance sur les tirages de …"
    exclusions:
      - {motif: "coût lissé sur une suite d'opérations, pas sur une distribution", voir: complexite_algo.amorti}
      - {motif: "l'algorithme est probabiliste et la question porte sur sa correction", voir: strategies.algorithme_probabiliste}
    exemples_positifs: []
    langages_plausibles: [theorique]
    statut: actif
    note: "Le programme limite lui-même l'étude « à quelques exemples simples ». Faible volume attendu."

  - id: complexite_algo.amorti
    libelle: "Analyser un coût amorti sur une suite d'opérations"
    semestre: S1
    origine: {programme: ["spe777:114-117"]}
    definition_operatoire: >
      La question porte sur le coût MOYEN par opération d'une longue suite
      d'opérations, dont certaines sont chères et rares — redimensionnement de
      tableau, compression de chemins. Reconnaissable au fait qu'une majoration
      opération par opération donnerait un résultat trop pessimiste.
    declencheurs:
      - "coût amorti de la suite d'opérations"
      - "montrer que n opérations coûtent au total O(…) et non n × O(…)"
    exclusions:
      - {motif: "moyenne sur une distribution d'entrées", voir: complexite_algo.moyenne}
    exemples_positifs:
      - source: "2024_TPAlgo-MPI-rapport#L1801"
        extrait: "Implémenter l'opération add_resize(d,k,v)."
    langages_plausibles: [theorique, mixte]
    statut: actif
    note: >
      L'exemple positif est une attestation indirecte : le redimensionnement de
      table de hachage est le support canonique de l'amortissement, mais la
      question de TPAlgo ne demande pas explicitement l'analyse amortie.
      À confirmer sur le corpus complet avant de la considérer attestée.
