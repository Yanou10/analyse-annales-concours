section:
  id: recursion
  libelle: "Récursivité et définitions inductives, mise en œuvre"
  ordre: 4
  perimetre: >
    La question demande d'ÉCRIRE une fonction récursive, de CONCEVOIR un type
    défini inductivement, ou porte sur le COÛT MACHINE de la récursion (pile,
    arbre d'appels). Ne PAS retenir cette section pour les preuves par induction :
    elles relèvent de `preuve.prouver_par_induction_structurelle`.
  note_origine: >
    §2 du programme. La colonne « Notions » de spe777:168-174 — « Récursivité
    d'une fonction. Récursivité croisée. Organisation des activations sous forme
    d'arbre » — est REFUSÉE comme telle : ce sont des objets, et « récursivité »
    est présupposée par presque toute question du corpus. L'étiqueter recréerait
    une étiquette-aimant. Seules les actions sont retenues.

notions:

  - id: recursion.ecrire_fonction_recursive
    libelle: "Écrire une fonction récursive sur une structure inductive"
    semestre: S1
    origine: {programme: ["spe777:168-174"], annexe: ["spe777:786-787"]}
    definition_operatoire: >
      La question demande de PRODUIRE du code ou du pseudo-code dont la structure
      suit celle d'un type inductif : filtrage sur les constructeurs, appel sur
      les sous-structures, cas de base. Retenir quand la récursion EST la
      difficulté de la question, pas quand elle en est un moyen incident.
    declencheurs:
      - "Écrire une fonction … qui prend en argument un arbre / un terme / une liste"
      - "Implémenter la fonction de signature : val f : t -> …"
      - "donner un algorithme récursif (en pseudo-code) qui …"
    exclusions:
      - {motif: "il faut PROUVER une propriété de la fonction, pas l'écrire", voir: preuve.prouver_par_induction_structurelle}
      - {motif: "la récursion sert à explorer un espace de solutions", voir: strategies.exploration_exhaustive}
      - {motif: "l'enjeu est le coût en pile, pas l'écriture", voir: ressources.analyser_cout_machine_appels_recursifs}
    exemples_positifs:
      - source: "2024_InfoA#L201"
        extrait: "Écrire une fonction split_last: tree -> tree * elt qui prend en argument un arbre AVL t, supposé non vide, et qui renvoie une paire (u, x) où x est le plus grand élément de t"
      - source: "2024_TPAlgo-MPI-rapport#L1313"
        extrait: "Implémenter la fonction de signature val hash : term -> int, telle que pour tout terme f(t1, . . . , tn)"
      - source: "2024_InfoC#L169"
        extrait: "donner un algorithme récursif (en pseudo-code) qui, étant donné un graphe G et un entier k, décide si τ(G) ⩽ k"
    langages_plausibles: [ocaml, c, pseudocode]
    statut: actif

  - id: recursion.definir_ensemble_inductif_et_type
    libelle: "Concevoir un type ou un ensemble défini par induction"
    semestre: S2
    origine: {programme: ["spe777:180-184"], annexe: ["spe777:800"]}
    definition_operatoire: >
      La question demande de DÉFINIR la structure elle-même : un type algébrique
      représentant un objet de l'énoncé, ou un ensemble comme le plus petit
      engendré par des règles. L'attendu est le choix des constructeurs, pas un
      algorithme.
    declencheurs:
      - "Définir un type OCaml qui représente …"
      - "Choisir un type de données, que l'on appellera …, pour représenter …"
      - "Définir une relation … par un système de règles d'inférence"
    exclusions:
      - {motif: "le type est donné et il faut écrire une fonction dessus", voir: recursion.ecrire_fonction_recursive}
      - {motif: "il s'agit de choisir une représentation pour sa complexité", voir: graphes_repr.choisir_representation_graphe_selon_complexite}
      - {motif: "les règles définissent un système de preuve", voir: logique.regles_inference}
    exemples_positifs:
      - source: "2024_Info-rapport#L591"
        extrait: "Question 1. Définir un type OCaml qui"
      - source: "2024_TPAlgo-MPI-rapport#L1367"
        extrait: "Choisir un type de données, que l'on appellera subst, pour représenter les substitutions."
      - source: "2024_Info-rapport#L1035"
        extrait: "Définir une relation m ≤σ v établissant la compatibilité entre un motif m et une valeur v"
    langages_plausibles: [ocaml, theorique]
    statut: actif

  - id: recursion.accumulateur_auxiliaire
    libelle: "Restructurer une récursion par accumulateur ou fonction auxiliaire"
    semestre: null
    origine: {hors_programme_recurrent: true}
    definition_operatoire: >
      La question impose une contrainte de coût ou de forme qui oblige à sortir de
      la récursion naïve : accumulateur, fonction auxiliaire portant un paramètre
      supplémentaire, remontée d'information multiple en un seul parcours.
    declencheurs:
      - "en un seul parcours de la structure"
      - "sans recalculer … / en temps linéaire alors que la version naïve est quadratique"
      - "la fonction devra renvoyer simultanément …"
    exclusions:
      - {motif: "aucune contrainte n'impose de restructurer", voir: recursion.ecrire_fonction_recursive}
      - {motif: "le gain vient de la mémoïsation de sous-problèmes qui se chevauchent", voir: strategies.programmation_dynamique}
    exemples_positifs:
      - source: "2024_InfoC#L78"
        extrait: "l'algorithme devra d'abord calculer en programmation dynamique pour chaque v ∈ V(G) les trois valeurs suivantes"
    langages_plausibles: [ocaml, c, pseudocode]
    statut: actif
    note: >
      Le programme ne la nomme pas ; elle est retenue au titre du critère du
      référentiel — « écrire une récursive avec accumulateur » est une chose qui
      se travaille en une soirée. Attestation faible dans l'échantillon, à
      réévaluer sur le corpus complet ; candidate à la fusion dans
      `recursion.ecrire_fonction_recursive` si elle reste sous 3 occurrences.

  - id: ressources.analyser_cout_machine_appels_recursifs
    libelle: "Analyser le coût machine de la récursion (pile, arbre d'appels)"
    semestre: S1
    origine:
      programme: ["spe777:168-174"]
      mise_en_oeuvre: ["spe777:188"]
    definition_operatoire: >
      La question porte sur l'empilement des blocs d'activation : profondeur de
      pile atteinte, nombre total d'appels, partage ou duplication de structures
      entre appels. Distincte de la complexité générale : l'objet est le
      mécanisme d'exécution.
    declencheurs:
      - "nombre total d'appels / d'entiers stockés dans l'ensemble des …"
      - "profondeur de la pile d'exécution"
      - "expliquer pourquoi il n'y a pas de contradiction (entre espace et total stocké)"
    exclusions:
      - {motif: "borne de coût sans référence au mécanisme d'appel", voir: complexite_algo.analyser_complexite_pire_cas}
      - {motif: "l'espace est celui des données allouées, pas de la pile", voir: complexite_algo.espace}
    exemples_positifs:
      - source: "2024_InfoA#L190"
        extrait: "Calculer le nombre total f(n) d'entiers (possiblement répétés) stockés dans l'ensemble des arbres du tableau a."
      - source: "2024_InfoA#L260"
        extrait: "On peut évoquer le lien avec l'empilement de blocs d'activation lors de l'appel à une fonction récursive."
    langages_plausibles: [theorique, ocaml]
    statut: actif
