section:
  id: idiomes
  libelle: Idiomes de programmation
  ordre: 17
  perimetre: Techniques de langage qui se révisent pour elles-mêmes (filtrage par motif, références, linéarisation
    de tableaux, retours multiples par pointeur). Le reste des annexes de langage alimente l'axe langage,
    pas le référentiel.
notions:
- id: idiomes.inferer_type_fragment_code
  slug: inferer_type_fragment_code
  libelle: Inférer le type d'une expression ou d'une fonction à la lecture d'un fragment de code
  semestre: null
  origine:
    genre: table
    cellule: commentaires
    source: 3.1:202-206
    verdict: eclate
  definition_operatoire: La question fournit un fragment de code (typiquement OCaml ou C) et demande de
    donner le type d'une expression, d'une variable ou d'une fonction, ou de repérer une incohérence de
    typage. Toute justification théorique du typage est exclue.
  declencheurs:
  - Donner le type de la fonction f suivante
  - Quel est le type de cette expression ?
  - Indiquer pourquoi ce fragment de code ne compile pas (types)
  - Préciser le type des arguments et du résultat
  exclusions:
  - motif: Écrire une fonction respectant une signature imposée relève de la programmation dans le langage,
      pas de l'inférence de type
    voir: null
  - motif: Concevoir un type inductif pour représenter une structure
    voir: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - ocaml
  - c
  - mixte
  statut: actif
- id: idiomes.lineariser_tableau_multidimensionnel
  slug: lineariser_tableau_multidimensionnel
  libelle: Manipuler des tableaux statiques et paramétrés, y compris leur représentation en mémoire
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 3.1:202-206
    verdict: eclate
  definition_operatoire: La question demande d'accéder, de parcourir ou de représenter des données dans
    un tableau (éventuellement à plusieurs dimensions, ou de type paramétré), en explicitant le calcul
    d'indice ou la structure composée employée.
  declencheurs:
  - Écrire l'accès à l'élément (i,j) d'une matrice stockée dans un tableau unidimensionnel
  - Définir une structure composée contenant un tableau et sa taille
  - Donner le type d'un tableau de tableaux
  exclusions:
  - motif: Inférer le type d'une expression déjà écrite
    voir: idiomes.inferer_type_fragment_code
  - motif: Allouer ce tableau dynamiquement et le libérer
    voir: ressources.gerer_allocation_dynamique_memoire
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - c
  - ocaml
  statut: actif
- id: idiomes.distinguer_structure_mutable_immuable
  slug: distinguer_structure_mutable_immuable
  libelle: Distinguer et programmer des opérations sur structures mutables ou immuables
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 3.1:215-216
    verdict: admis_reformule
  definition_operatoire: La question demande de dire si une structure ou une opération modifie la donnée
    en place ou renvoie une nouvelle valeur, d'écrire les deux variantes d'une même opération, ou d'expliquer
    un effet de partage/aliasing résultant de la mutabilité.
  declencheurs:
  - Cette fonction modifie-t-elle son argument ou renvoie-t-elle une nouvelle structure ?
  - Écrire une version impérative (en place) de cette fonction
  - Expliquer ce que devient l'ancienne valeur après cette opération
  - Quel est l'intérêt d'une structure immuable ici ?
  exclusions:
  - motif: Spécification de l'interface d'une structure abstraite indépendamment de la mutabilité
    voir: sd_sequentielles.specifier_structure_abstraite_par_operations
  - motif: Usage des références et effets de bord comme idiome de langage à part entière
    voir: null
  exemples_positifs:
  - source: 2024_InfoA
    question: Q14
  exemples_negatifs: []
  langages_plausibles:
  - ocaml
  - c
  statut: actif
- id: idiomes.ecrire_filtrage_par_motifs
  slug: ecrire_filtrage_par_motifs
  libelle: Écrire un filtrage par motifs, en regroupant les cas équivalents
  semestre: null
  origine:
    genre: annexe
    cellule: annexe
    source: traits-divers:830-830
    verdict: admis_reformule
  definition_operatoire: La question demande de définir une fonction par analyse de cas sur la forme de
    son argument, avec la notation function ou match, en regroupant éventuellement plusieurs motifs partageant
    les mêmes variables.
  declencheurs:
  - Compléter le filtrage suivant
  - Écrire cette fonction par filtrage de motifs
  - Donner les cas manquants du match
  - Définir la fonction à l'aide de function | … -> …
  exclusions:
  - motif: Écrire la définition du type inductif filtré
    voir: recursion.definir_types_mutuellement_recursifs
  - motif: Analyse de cas exprimée par une cascade de conditionnelles
    voir: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - ocaml
  statut: actif
