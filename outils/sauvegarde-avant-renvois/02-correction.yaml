section:
  id: correction
  libelle: Correction et terminaison d'un algorithme
  ordre: 2
  perimetre: 'L''algorithme est fourni par l''énoncé et on demande d''en établir une garantie : arrêt,
    résultat conforme, invariant de structure, jeu de tests.'
notions:
- id: correction.analyser_precision_calcul_flottant
  slug: analyser_precision_calcul_flottant
  libelle: Analyser les erreurs de précision d'un calcul en virgule flottante
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 1.1:107-110
    verdict: admis_reformule
  definition_operatoire: La question demande d'expliquer ou de prévoir un écart entre le résultat mathématique
    attendu et la valeur calculée par un programme utilisant des flottants, ou de corriger un test d'égalité
    entre flottants en tenant compte de la précision.
  declencheurs:
  - Expliquer pourquoi ce programme n'affiche pas la valeur attendue
  - Cette boucle sur des flottants termine-t-elle ? Pourquoi ?
  - Réécrire ce test d'égalité entre deux flottants
  - Justifier la divergence entre le calcul théorique et les valeurs calculées
  exclusions:
  - motif: Preuve de terminaison d'une boucle par un variant entier
    voir: correction.prouver_terminaison_par_variant
  - motif: Représentation binaire des entiers et débordements entiers
    voir: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - c
  - ocaml
  - theorique
  statut: actif
- id: correction.prouver_terminaison_par_variant
  slug: prouver_terminaison_par_variant
  libelle: Prouver la terminaison d'un algorithme par un variant
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 1.1:111-113
    verdict: eclate
  definition_operatoire: La question fournit une boucle ou une fonction récursive et demande d'exhiber
    une quantité qui décroît strictement dans un ordre bien fondé, puis d'en conclure l'arrêt.
  declencheurs:
  - Proposer un variant de boucle et en déduire la terminaison
  - Montrer que cet algorithme termine
  - Justifier que la quantité choisie décroît strictement à chaque itération
  - Cet appel récursif termine-t-il ? Justifier
  exclusions:
  - motif: Établir que le résultat rendu est correct une fois l'arrêt acquis
    voir: correction.prouver_correction_partielle_par_invariant
  - motif: Compter le nombre d'itérations pour évaluer un coût
    voir: complexite_algo.analyser_complexite_pire_cas
  exemples_positifs:
  - source: 2024_InfoA
    question: Q6
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  - pseudocode
  - ocaml
  - c
  statut: actif
- id: correction.prouver_correction_partielle_par_invariant
  slug: prouver_correction_partielle_par_invariant
  libelle: Prouver la correction partielle d'un algorithme par un invariant de boucle
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 1.1:111-113
    verdict: eclate
  definition_operatoire: La question demande d'énoncer une propriété vraie avant et après chaque itération,
    de l'établir par initialisation et hérédité, puis d'en déduire la conformité du résultat à la spécification
    (correction totale en y adjoignant la terminaison).
  declencheurs:
  - Proposer un invariant de boucle et démontrer qu'il est préservé
  - Montrer que cet algorithme est partiellement correct
  - En déduire la correction totale de l'algorithme
  - Que vaut l'invariant en sortie de boucle ? Conclure
  exclusions:
  - motif: Démontrer seulement l'arrêt de l'algorithme
    voir: correction.prouver_terminaison_par_variant
  - motif: Preuve par induction structurelle sur un type inductif
    voir: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  - pseudocode
  - ocaml
  - c
  statut: actif
- id: correction.construire_jeu_tests_manuel
  slug: construire_jeu_tests_manuel
  libelle: Construire à la main un jeu de tests pour un programme
  semestre: null
  origine:
    genre: table
    cellule: commentaires
    source: 1.3:150-151
    verdict: admis_reformule
  definition_operatoire: La question demande de proposer des cas de test (entrées et sorties attendues)
    pour un programme ou une fonction donnée, en justifiant le choix des cas par le partitionnement des
    domaines d'entrée ou le test des valeurs limites.
  declencheurs:
  - Proposer un jeu de tests pour cette fonction, en donnant pour chaque entrée la sortie attendue
  - Quels cas limites faut-il tester pour cette fonction ?
  - Partitionner le domaine d'entrée et donner un cas représentatif par partie
  - Donner un exemple d'entrée mettant en évidence l'erreur de ce programme
  exclusions:
  - motif: Jeu de tests construit pour satisfaire un critère de couverture du graphe de flot de contrôle
    voir: correction.construire_jeu_tests_couverture
  - motif: Jeu de tests énumérant toutes les façons de satisfaire une condition booléenne composée
    voir: correction.tester_exhaustivement_condition_booleenne
  - motif: Démonstration que l'algorithme renvoie le résultat attendu sur toute entrée
    voir: null
  - motif: Génération automatique de jeux de tests, non attendue
    voir: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  - pseudocode
  - ocaml
  - c
  statut: actif
- id: correction.construire_graphe_flot_controle
  slug: construire_graphe_flot_controle
  libelle: Construire le graphe de flot de contrôle d'un programme et en identifier les chemins faisables
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 1.3:152-154
    verdict: eclate
  definition_operatoire: La question fournit un fragment de programme et demande d'en dessiner le graphe
    de flot de contrôle, d'énumérer ses chemins, ou de décider quels chemins sont faisables (réalisables
    par une exécution effective).
  declencheurs:
  - Dessiner le graphe de flot de contrôle de cette fonction
  - Énumérer les chemins sans cycle de ce graphe de flot de contrôle
  - Ce chemin du graphe de flot de contrôle est-il faisable ? Justifier
  - Combien de branches comporte ce programme ?
  exclusions:
  - motif: Fournir les données de test qui couvrent ces chemins
    voir: correction.construire_jeu_tests_couverture
  - motif: Représenter ou parcourir un graphe quelconque donné par l'énoncé
    voir: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - c
  - ocaml
  - theorique
  statut: actif
- id: correction.construire_jeu_tests_couverture
  slug: construire_jeu_tests_couverture
  libelle: Construire un jeu de tests satisfaisant un critère de couverture
  semestre: null
  origine:
    genre: table
    cellule: commentaires
    source: 1.3:152-154
    verdict: eclate
  definition_operatoire: La question demande de fournir des entrées de test réalisant la couverture des
    instructions (sommets), des branches (arcs) ou des chemins faisables du graphe de flot de contrôle,
    ou d'évaluer le taux de couverture atteint par un jeu de tests donné.
  declencheurs:
  - Donner un jeu de tests couvrant toutes les instructions de ce programme
  - Proposer des entrées assurant la couverture des branches
  - Ce jeu de tests couvre-t-il tous les arcs du graphe de flot de contrôle ?
  - Combien de tests faut-il au minimum pour couvrir tous les chemins sans cycle ?
  exclusions:
  - motif: Dessiner le graphe ou décider de la faisabilité d'un chemin
    voir: correction.construire_graphe_flot_controle
  - motif: Choix des cas guidé par le partitionnement du domaine d'entrée et non par un critère de couverture
    voir: correction.construire_jeu_tests_manuel
  - motif: Couverture des combinaisons de valeurs d'une condition booléenne composée
    voir: correction.tester_exhaustivement_condition_booleenne
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - c
  - ocaml
  - theorique
  statut: actif
- id: correction.tester_exhaustivement_condition_booleenne
  slug: tester_exhaustivement_condition_booleenne
  libelle: Tester exhaustivement une condition booléenne composée de boucle ou de conditionnelle
  semestre: null
  origine:
    genre: table
    cellule: commentaires
    source: 1.3:155-160
    verdict: admis_reformule
  definition_operatoire: La question porte sur une condition contenant des conjonctions ou disjonctions
    et demande de formuler les tests réalisant toutes les manières de la satisfaire ou de la falsifier,
    plutôt que de la traiter comme globalement vraie ou fausse.
  declencheurs:
  - Donner les tests couvrant toutes les façons de satisfaire cette condition
  - Un test rendant la condition vraie suffit-il ? Justifier
  - Énumérer les combinaisons de valeurs des sous-conditions à tester
  - Proposer des entrées mettant en défaut chacune des sous-conditions de cette boucle
  exclusions:
  - motif: Couverture des sommets, arcs ou chemins du graphe de flot de contrôle
    voir: correction.construire_jeu_tests_couverture
  - motif: Choix des cas par partitionnement du domaine d'entrée ou test des limites
    voir: correction.construire_jeu_tests_manuel
  - motif: Construire la table de vérité d'une formule pour en étudier la satisfiabilité
    voir: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - c
  - ocaml
  - theorique
  statut: actif
- id: correction.specifier_entrees_sorties_algorithme
  slug: specifier_entrees_sorties_algorithme
  libelle: Spécifier les entrées, sorties et préconditions d'un algorithme
  semestre: null
  origine:
    genre: prose
    cellule: prose
    source: 4:304-305
    verdict: eclate
  definition_operatoire: La question demande d'énoncer précisément ce que prend et ce que rend un algorithme
    (nature des données, hypothèses sur les entrées, propriété attendue de la sortie), avant ou indépendamment
    de toute preuve. S'applique aussi quand on demande de traduire un énoncé informel en spécification
    exploitable.
  declencheurs:
  - Préciser les entrées et les sorties de cet algorithme
  - Donner la spécification de la fonction demandée
  - Quelles hypothèses doit vérifier l'argument pour que la fonction termine correctement ?
  - Énoncer ce que renvoie cette fonction
  exclusions:
  - motif: Démontrer que la sortie satisfait la spécification
    voir: correction.etablir_correction_algorithme
  - motif: Évaluer le coût de l'algorithme spécifié
    voir: complexite_algo.evaluer_complexite_algorithme
  - motif: Traduire un problème concret en objet formel (graphe, formule, automate)
    voir: null
  exemples_positifs:
  - source: 2024_InfoA
    question: Q10
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  - pseudocode
  - indetermine
  statut: actif
- id: correction.etablir_correction_algorithme
  slug: etablir_correction_algorithme
  libelle: Établir la correction d'un algorithme fourni
  semestre: null
  origine:
    genre: prose
    cellule: prose
    source: 4:304-305
    verdict: eclate
  definition_operatoire: La question fournit un algorithme et demande de justifier qu'il calcule bien
    ce qu'annonce sa spécification, en s'appuyant sur un invariant, un raisonnement par cas ou par induction
    sur la structure traitée.
  declencheurs:
  - Montrer que cet algorithme est correct
  - Prouver que la fonction renvoie bien le résultat attendu
  - Proposer un invariant de boucle et en déduire la correction
  - Justifier la validité de l'algorithme précédent
  exclusions:
  - motif: Justifier seulement l'arrêt de l'algorithme, sans conformité du résultat
    voir: null
  - motif: Énoncer entrées et sorties sans rien démontrer
    voir: correction.specifier_entrees_sorties_algorithme
  - motif: Compter les opérations effectuées
    voir: complexite_algo.evaluer_complexite_algorithme
  exemples_positifs:
  - source: 2024_InfoA
    question: Q6
  - source: 2024_InfoA
    question: Q7
  - source: 2024_InfoA
    question: Q8
  - source: 2024_InfoA
    question: Q12
  - source: 2024_InfoA
    question: Q13
  - source: 2024_InfoC
    question: III.1
  - source: 2024_InfoC
    question: III.5
  - source: 2024_InfoC
    question: IV.3
  - source: 2024_InfoC
    question: IV.6
  exemples_negatifs:
  - source: 2024_InfoA
    question: Q10
    motif: '« Expliquer ce que fait la fonction split » : on demande la spécification, pas sa preuve.'
  langages_plausibles:
  - theorique
  - pseudocode
  - ocaml
  - c
  statut: actif
- id: correction.verifier_admissibilite_monotonie_heuristique
  slug: verifier_admissibilite_monotonie_heuristique
  libelle: Vérifier l'admissibilité et la monotonie d'une heuristique
  semestre: null
  origine:
    genre: table
    cellule: commentaires
    source: 4.6:430-431
    verdict: eclate
  definition_operatoire: La question fournit une heuristique sur un graphe d'états et demande de contrôler
    qu'elle ne surestime jamais le coût restant, ou qu'elle est monotone (consistante), et d'en tirer
    les conséquences sur le résultat de la recherche.
  declencheurs:
  - Cette heuristique est-elle admissible ? Justifier
  - Montrer que cette heuristique est monotone
  - Donner un exemple d'heuristique non admissible et le chemin erroné obtenu
  - Quelle conséquence la monotonie a-t-elle sur les états déjà développés ?
  exclusions:
  - motif: Déroulement de la recherche elle-même
    voir: graphes_algo.rechercher_chemin_a_etoile
  - motif: Fonction d'évaluation d'une position de jeu à deux joueurs
    voir: strategies.appliquer_minmax_avec_heuristique
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  statut: actif
