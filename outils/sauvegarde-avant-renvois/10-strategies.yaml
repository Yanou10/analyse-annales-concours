section:
  id: strategies
  libelle: Stratégies algorithmiques
  ordre: 10
  perimetre: 'Choisir et mettre en œuvre une stratégie : exploration exhaustive, glouton, diviser pour
    régner, programmation dynamique, approximation, probabiliste.'
notions:
- id: strategies.concevoir_algorithme_las_vegas
  slug: concevoir_algorithme_las_vegas
  libelle: Concevoir et analyser un algorithme probabiliste de type Las Vegas
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 4.1:310-315
    verdict: eclate
  definition_operatoire: La question demande d'écrire ou d'analyser un algorithme qui tire au hasard et
    renvoie toujours un résultat correct, en discutant le nombre d'essais ou le coût espéré (tirages répétés
    jusqu'au succès, construction d'un objet difficile à produire de façon déterministe).
  declencheurs:
  - Proposer un algorithme de type Las Vegas pour construire ...
  - Justifier que cet algorithme renvoie toujours un résultat correct et calculer le nombre moyen de tirages
  - Écrire une fonction qui tire au hasard jusqu'à obtenir un objet vérifiant la propriété
  - Estimer le coût espéré de cette procédure aléatoire
  exclusions:
  - motif: Algorithme aléatoire dont le résultat peut être faux avec une certaine probabilité
    voir: strategies.concevoir_algorithme_monte_carlo
  - motif: Algorithme aléatoire dont on demande seulement le rapport à l'optimum d'un problème d'optimisation
    voir: strategies.evaluer_algorithme_approximation
  - motif: Analyse du coût d'un algorithme déterministe dans le pire ou le meilleur cas
    voir: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  - pseudocode
  - ocaml
  - c
  statut: actif
- id: strategies.concevoir_algorithme_monte_carlo
  slug: concevoir_algorithme_monte_carlo
  libelle: Concevoir et analyser un algorithme probabiliste de type Monte Carlo
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 4.1:310-315
    verdict: eclate
  definition_operatoire: La question demande d'écrire ou d'analyser un algorithme aléatoire de coût borné
    dont la réponse peut être erronée, et d'évaluer ou de réduire la probabilité d'erreur (par exemple
    par répétitions indépendantes).
  declencheurs:
  - Montrer que cet algorithme répond correctement avec probabilité au moins ...
  - Combien de répétitions faut-il pour que la probabilité d'erreur soit inférieure à epsilon ?
  - Proposer un algorithme de type Monte Carlo pour décider si ...
  - Majorer la probabilité que l'algorithme se trompe
  exclusions:
  - motif: Algorithme aléatoire toujours correct dont seul le temps varie
    voir: strategies.concevoir_algorithme_las_vegas
  - motif: Garantie portant sur la qualité d'une solution par rapport à l'optimum
    voir: strategies.evaluer_algorithme_approximation
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  - pseudocode
  - ocaml
  - c
  statut: actif
- id: strategies.evaluer_algorithme_approximation
  slug: evaluer_algorithme_approximation
  libelle: Établir la garantie d'approximation d'un algorithme sur un problème d'optimisation
  semestre: null
  origine:
    genre: table
    cellule: commentaires
    source: 4.1:316-320
    verdict: admis_reformule
  definition_operatoire: La question fournit un problème d'optimisation avec sa fonction de coût et un
    algorithme rapide, et demande de montrer que la solution produite est à un facteur donné de l'optimum
    (éventuellement en espérance, comme sur MAX2SAT).
  declencheurs:
  - Montrer que cet algorithme est une 2-approximation du problème
  - Majorer le rapport entre le coût de la solution renvoyée et le coût optimal
  - Montrer qu'une affectation tirée au hasard satisfait en moyenne au moins ... des clauses
  - Justifier que l'algorithme fournit une solution de qualité garantie en temps polynomial
  exclusions:
  - motif: Algorithme aléatoire dont on mesure la probabilité de se tromper et non l'écart à l'optimum
    voir: strategies.concevoir_algorithme_monte_carlo
  - motif: Algorithme aléatoire toujours exact dont on analyse le temps espéré
    voir: strategies.concevoir_algorithme_las_vegas
  - motif: Classement du problème d'optimisation dans une classe de complexité ou réduction
    voir: null
  - motif: Preuve d'optimalité exacte d'une stratégie gloutonne
    voir: null
  exemples_positifs:
  - source: 2024_InfoC
    question: III.6
  - source: 2024_InfoC
    question: III.7
  - source: 2024_InfoC
    question: VI.5
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  - pseudocode
  statut: actif
- id: strategies.explorer_par_force_brute
  slug: explorer_par_force_brute
  libelle: Énumérer exhaustivement les candidats par force brute
  semestre: S2
  origine:
    genre: table
    cellule: notions
    source: 4.2:326-327
    verdict: eclate
  definition_operatoire: La question demande de concevoir ou d'analyser un algorithme qui parcourt systématiquement
    tout l'espace des candidats (n-uplets, sous-ensembles, permutations) pour tester chacun d'eux. Elle
    peut aussi demander le dénombrement des candidats explorés.
  declencheurs:
  - Écrire un algorithme qui énumère toutes les configurations possibles et retient celles qui vérifient
    la contrainte
  - Proposer une solution par recherche exhaustive
  - Combien de candidats cet algorithme teste-t-il dans le pire cas ?
  - Écrire une fonction qui engendre tous les sous-ensembles / toutes les permutations
  exclusions:
  - motif: L'exploration abandonne une branche dès qu'une contrainte partielle est violée
    voir: strategies.explorer_avec_retour_sur_trace
  - motif: L'exploration élague à l'aide d'une borne sur la valeur de l'objectif
    voir: strategies.explorer_par_separation_evaluation
  - motif: Le coût asymptotique de l'énumération est l'objet unique de la question sans conception d'algorithme
    voir: null
  exemples_positifs:
  - source: 2024_InfoC
    question: I.5
  - source: 2024_InfoC
    question: IV.1
  exemples_negatifs:
  - source: 2024_InfoC
    question: IV.6
    motif: 'l''algorithme est récursif avec branchement sur le degré et complexité 1,4656^k : ce n''est
      plus de l''énumération exhaustive.'
  langages_plausibles:
  - pseudocode
  - ocaml
  - c
  - theorique
  statut: actif
- id: strategies.explorer_avec_retour_sur_trace
  slug: explorer_avec_retour_sur_trace
  libelle: Explorer avec retour sur trace en élaguant les solutions partielles invalides
  semestre: S2
  origine:
    genre: table
    cellule: notions
    source: 4.2:326-327
    verdict: eclate
  definition_operatoire: La question demande de construire une solution incrémentalement, de revenir en
    arrière lorsqu'une solution partielle ne peut plus aboutir, et éventuellement de comparer le nombre
    de configurations visitées avec celui de la force brute.
  declencheurs:
  - Écrire un algorithme de retour sur trace résolvant ce problème (n reines, sudoku, coloration)
  - Compléter la fonction récursive en ajoutant le test d'abandon d'une branche
  - Expliquer quelles branches de l'arbre d'exploration sont coupées
  - Justifier que l'algorithme par backtracking trouve toutes les solutions
  exclusions:
  - motif: 'Aucun abandon de branche : tous les candidats complets sont testés'
    voir: strategies.explorer_par_force_brute
  - motif: L'élagage repose sur une borne d'évaluation de l'objectif à optimiser
    voir: strategies.explorer_par_separation_evaluation
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - ocaml
  - c
  statut: actif
- id: strategies.ordonner_donnees_avant_parcours
  slug: ordonner_donnees_avant_parcours
  libelle: Ordonner les données avant parcours pour accélérer une exploration
  semestre: S2
  origine:
    genre: table
    cellule: commentaires
    source: 4.2:326-327
    verdict: eclate
  definition_operatoire: La question demande d'exploiter un tri préalable ou un balayage ordonné (droite
    de balayage) des données pour réduire le nombre de cas examinés par une exploration, et d'en justifier
    le gain.
  declencheurs:
  - Montrer qu'un tri préalable des données réduit le coût de l'exploration
  - Proposer un algorithme par droite de balayage pour ce problème géométrique
  - Dans quel ordre traiter les objets pour élaguer plus tôt ?
  - Justifier le gain apporté par le prétraitement des données
  exclusions:
  - motif: Le tri est utilisé pour construire une solution par choix localement optimal
    voir: null
  - motif: L'exploration considérée n'ordonne pas les données et teste tous les candidats
    voir: strategies.explorer_par_force_brute
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - theorique
  - c
  statut: actif
- id: strategies.explorer_par_separation_evaluation
  slug: explorer_par_separation_evaluation
  libelle: Élaguer une exploration par séparation et évaluation
  semestre: S3-4
  origine:
    genre: table
    cellule: notions
    source: 4.2:328-330
    verdict: eclate
  definition_operatoire: La question demande de résoudre un problème d'optimisation en découpant l'espace
    de recherche et en coupant les branches dont la borne d'évaluation est moins bonne que la meilleure
    solution connue, ou d'exécuter/justifier un tel élagage.
  declencheurs:
  - Dérouler l'algorithme de séparation et évaluation sur cet exemple
  - Écrire l'algorithme de branch and bound pour ce problème d'optimisation
  - Justifier que l'élagage par borne ne supprime aucune solution optimale
  - Quelle branche peut-on couper connaissant la meilleure solution courante ?
  exclusions:
  - motif: L'élagage porte sur la violation d'une contrainte et non sur une borne de l'objectif
    voir: strategies.explorer_avec_retour_sur_trace
  - motif: La question porte seulement sur le calcul de la borne par relâchement des contraintes
    voir: strategies.evaluer_borne_par_relaxation
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - theorique
  - c
  - ocaml
  statut: actif
- id: strategies.evaluer_borne_par_relaxation
  slug: evaluer_borne_par_relaxation
  libelle: Majorer l'optimum en relâchant les contraintes du problème
  semestre: S3-4
  origine:
    genre: table
    cellule: commentaires
    source: 4.2:328-330
    verdict: eclate
  definition_operatoire: La question demande de construire une borne sur la valeur optimale en résolvant
    une version relâchée du problème (par exemple relaxation continue d'un problème en variables entières)
    et de justifier que cette valeur borne bien l'optimum.
  declencheurs:
  - Calculer la borne fournie par la relaxation continue de ce problème
  - Montrer que la valeur obtenue majore la valeur de toute solution entière
  - Proposer une fonction d'évaluation pour l'élagage
  - Résoudre la version relâchée du problème du sac à dos
  exclusions:
  - motif: La question porte sur le schéma d'exploration qui utilise la borne
    voir: strategies.explorer_par_separation_evaluation
  - motif: La question porte sur la garantie de qualité d'une solution approchée sans exploration
    voir: null
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  - pseudocode
  statut: actif
- id: strategies.classifier_k_plus_proches_voisins
  slug: classifier_k_plus_proches_voisins
  libelle: Classifier un exemple par les k plus proches voisins
  semestre: null
  origine:
    genre: table
    cellule: commentaires
    source: 4.6:412-416
    verdict: eclate
  definition_operatoire: La question fournit un ensemble d'exemples étiquetés et demande de prédire l'étiquette
    d'un nouveau point en calculant les distances euclidiennes, en sélectionnant les k plus proches et
    en votant, ou d'en écrire/analyser le coût.
  declencheurs:
  - Déterminer la classe prédite par l'algorithme des k plus proches voisins
  - Écrire une fonction qui renvoie les k plus proches voisins d'un point
  - Calculer la distance euclidienne entre deux vecteurs de caractéristiques
  - Discuter l'influence de k sur la prédiction
  exclusions:
  - motif: Accélérer la recherche des voisins par une structure de partition de l'espace
    voir: sd_hierarchiques.organiser_points_arbre_k_dimensionnel
  - motif: Évaluer la qualité d'un classifieur par comptage des erreurs par classe
    voir: strategies.evaluer_classifieur_matrice_confusion
  - motif: Regrouper des points sans étiquettes
    voir: strategies.partitionner_par_k_moyennes
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - ocaml
  - c
  - theorique
  statut: actif
- id: strategies.construire_arbre_decision_id3
  slug: construire_arbre_decision_id3
  libelle: Construire un arbre de décision binaire par l'algorithme ID3
  semestre: null
  origine:
    genre: table
    cellule: commentaires
    source: 4.6:412-416
    verdict: eclate
  definition_operatoire: La question fournit une table d'exemples avec attributs et demande de choisir
    les attributs de découpe (entropie, gain d'information) et de construire l'arbre binaire résultant,
    ou de classer un exemple avec cet arbre.
  declencheurs:
  - Construire l'arbre de décision obtenu par ID3 sur ce jeu d'exemples
  - Calculer le gain d'information de cet attribut
  - Indiquer l'attribut choisi à la racine et justifier
  - Expliquer un phénomène de sur-apprentissage sur cet arbre
  exclusions:
  - motif: Mesurer les performances du classifieur obtenu
    voir: strategies.evaluer_classifieur_matrice_confusion
  - motif: Classification sans étiquettes
    voir: strategies.regrouper_par_classification_hierarchique_ascendante
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - theorique
  - ocaml
  statut: actif
- id: strategies.evaluer_classifieur_matrice_confusion
  slug: evaluer_classifieur_matrice_confusion
  libelle: Évaluer un classifieur au moyen d'une matrice de confusion
  semestre: null
  origine:
    genre: table
    cellule: commentaires
    source: 4.6:412-416
    verdict: eclate
  definition_operatoire: La question demande de remplir ou d'interpréter une matrice de confusion à partir
    de prédictions et d'étiquettes réelles, d'en déduire des indicateurs de qualité, ou de diagnostiquer
    un sur-apprentissage.
  declencheurs:
  - Remplir la matrice de confusion correspondant à ces prédictions
  - Interpréter cette matrice de confusion
  - Ce classifieur est-il en situation de sur-apprentissage ? Justifier
  - Comparer deux classifieurs à partir de leurs matrices de confusion
  exclusions:
  - motif: Production des prédictions elles-mêmes par vote de voisins
    voir: strategies.classifier_k_plus_proches_voisins
  - motif: Construction du modèle arborescent évalué
    voir: strategies.construire_arbre_decision_id3
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - theorique
  - pseudocode
  statut: actif
- id: strategies.regrouper_par_classification_hierarchique_ascendante
  slug: regrouper_par_classification_hierarchique_ascendante
  libelle: Regrouper des données par classification hiérarchique ascendante
  semestre: null
  origine:
    genre: table
    cellule: commentaires
    source: 4.6:417-420
    verdict: eclate
  definition_operatoire: La question demande de fusionner itérativement les groupes les plus proches selon
    une distance donnée, de produire le dendrogramme ou la partition obtenue à un seuil, ou d'en analyser
    le coût.
  declencheurs:
  - Appliquer la classification hiérarchique ascendante à ces points
  - Donner le dendrogramme obtenu
  - Indiquer l'ordre des fusions effectuées
  - Évaluer la complexité de la classification hiérarchique ascendante
  exclusions:
  - motif: Partition en k groupes par recentrage itératif
    voir: strategies.partitionner_par_k_moyennes
  - motif: Classification à partir d'exemples étiquetés
    voir: strategies.classifier_k_plus_proches_voisins
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - theorique
  - ocaml
  - c
  statut: actif
- id: strategies.partitionner_par_k_moyennes
  slug: partitionner_par_k_moyennes
  libelle: Partitionner des données par l'algorithme des k-moyennes
  semestre: null
  origine:
    genre: table
    cellule: commentaires
    source: 4.6:417-420
    verdict: eclate
  definition_operatoire: La question demande de dérouler ou d'implémenter les itérations d'affectation
    aux centres puis de recalcul des centres, de discuter l'arrêt ou la convergence vers un minimum local
    selon l'initialisation.
  declencheurs:
  - Dérouler l'algorithme des k-moyennes à partir de ces centres initiaux
  - Écrire la fonction d'affectation des points au centre le plus proche
  - Montrer sur cet exemple une convergence vers un minimum local
  - Discuter l'influence de l'initialisation des centres
  exclusions:
  - motif: Fusions successives de groupes sans nombre de classes fixé
    voir: strategies.regrouper_par_classification_hierarchique_ascendante
  - motif: Prédiction d'étiquette à partir de voisins étiquetés
    voir: strategies.classifier_k_plus_proches_voisins
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - ocaml
  - c
  - theorique
  statut: actif
- id: strategies.appliquer_minmax_avec_heuristique
  slug: appliquer_minmax_avec_heuristique
  libelle: Évaluer une position par l'algorithme min-max avec heuristique
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 4.6:427-429
    verdict: eclate
  definition_operatoire: La question fournit un arbre de jeu ou une profondeur limite et une fonction
    d'évaluation heuristique, et demande de calculer les valeurs min-max des nœuds, le coup choisi, ou
    d'écrire l'algorithme récursif.
  declencheurs:
  - Calculer la valeur min-max de la racine de cet arbre de jeu
  - Écrire la fonction récursive min-max avec évaluation à profondeur donnée
  - Indiquer le coup choisi par min-max
  - Donner le nombre de positions évaluées par min-max
  exclusions:
  - motif: Coupures évitant d'explorer certaines branches
    voir: strategies.elaguer_arbre_de_jeu_alpha_beta
  - motif: Détermination exacte des positions gagnantes par attracteurs
    voir: graphes_algo.calculer_positions_gagnantes_attracteurs
  - motif: Recherche de chemin dans un graphe d'états à un seul agent
    voir: graphes_algo.rechercher_chemin_a_etoile
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - ocaml
  - c
  - theorique
  statut: actif
- id: strategies.elaguer_arbre_de_jeu_alpha_beta
  slug: elaguer_arbre_de_jeu_alpha_beta
  libelle: Élaguer un arbre de jeu par coupures alpha-bêta
  semestre: null
  origine:
    genre: table
    cellule: notions
    source: 4.6:427-429
    verdict: eclate
  definition_operatoire: 'La question demande d''appliquer l''élagage alpha-bêta sur un arbre de jeu :
    indiquer les branches coupées, les valeurs de alpha et bêta, le gain en nombre de nœuds explorés,
    ou d''implémenter la variante de min-max.'
  declencheurs:
  - Indiquer les branches élaguées par alpha-bêta sur cet arbre
  - Donner les valeurs de alpha et bêta à chaque nœud
  - Écrire l'algorithme min-max avec élagage alpha-bêta
  - Comparer le nombre de nœuds explorés avec et sans élagage
  exclusions:
  - motif: Parcours complet de l'arbre de jeu sans coupure
    voir: strategies.appliquer_minmax_avec_heuristique
  - motif: Élagage de branches dans une recherche de voisins géométriques
    voir: sd_hierarchiques.organiser_points_arbre_k_dimensionnel
  exemples_positifs: []
  exemples_negatifs: []
  langages_plausibles:
  - pseudocode
  - ocaml
  - c
  - theorique
  statut: actif
